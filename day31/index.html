<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>판단의언어란 — Post-it Type</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Jua&family=Noto+Sans+KR:wght@900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1A1A1A;
    --postit: #FFC600;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body {
    font-family: "Black Han Sans", "Noto Sans KR", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 48px 40px 80px;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 900px;
  }

  .canvas-wrap {
    position: relative;
    width: 100%;
    margin: 0 auto;
  }

  .postit {
    position: absolute;
    background: var(--postit);
    will-change: transform;
    border-radius: 1px;
    pointer-events: none;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    transition: transform 0.3s ease-out, opacity 0.3s ease-out;
  }

  .footnote {
    position: fixed;
    left: 40px;
    bottom: 30px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    line-height: 1.5;
    pointer-events: none;
  }

  /* 비네팅 */
  .stage::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(120% 80% at 50% 50%, transparent 55%, rgba(0,0,0,0.4) 100%);
  }

  /* 숨겨진 캔버스 */
  #sampler { position: absolute; left: -99999px; top: 0; }

  /* 힌트 */
  .hint {
    position: fixed;
    bottom: 30px;
    right: 40px;
    color: rgba(255,255,255,0.3);
    font-size: 11px;
    letter-spacing: 0.05em;
    pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="sampler"></canvas>

<div class="stage">
  <div class="canvas-wrap" id="wrap"></div>
</div>

<div class="footnote">
  DAY31 — POST-IT TYPE<br/>
  판단의언어란
</div>

<div class="hint">hover to scatter</div>

<script>
// ============================================
// 설정
// ============================================
const CONFIG = {
  headline: '판단의\n언어란',
  fontFamily: 'Black Han Sans',
  fontWeight: 900,
  letterSpacing: -3,
  lineHeight: 1.06,
  postitSize: 22,
  postitSpacing: 14,
  rotJitter: 30,
  posJitter: 5,
  scaleJitter: 0.15,
  threshold: 140,
  postitColor: '#FFC600',
  borderColor: '#1A1A1A',
  borderWidth: 0.5,
};

// ============================================
// 픽셀 샘플링: 텍스트 → 포스트잇 위치
// ============================================
function samplePostits(text, opts) {
  const {
    fontFamily, fontWeight, letterSpacing, lineHeight,
    postitSize, postitSpacing, threshold, maxWidth,
  } = opts;

  const canvas = document.getElementById('sampler');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  const lines = text.split('\n').filter(l => l.length > 0);
  if (lines.length === 0) return { items: [], width: 0, height: 0 };

  // 측정용 폰트 크기
  const measureSize = 200;
  ctx.font = `${fontWeight} ${measureSize}px ${fontFamily}, sans-serif`;
  ctx.textBaseline = 'alphabetic';

  // 가장 긴 줄 측정
  let longest = 0;
  for (const l of lines) longest = Math.max(longest, ctx.measureText(l).width);

  const lsAtMeasure = letterSpacing * (measureSize / 100);
  const widestLineCharCount = Math.max(...lines.map(l => l.length));
  longest += lsAtMeasure * (widestLineCharCount - 1);

  // maxWidth의 94%에 맞추기
  const target = maxWidth * 0.94;
  const scale = target / Math.max(longest, 1);
  const fontSize = measureSize * scale;
  const ls = lsAtMeasure * scale;
  const lh = fontSize * lineHeight;

  // 캔버스 크기
  const W = Math.ceil(maxWidth);
  const H = Math.ceil(lh * lines.length + fontSize * 0.3);
  canvas.width = W;
  canvas.height = H;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000';
  ctx.font = `${fontWeight} ${fontSize}px ${fontFamily}, sans-serif`;
  ctx.textBaseline = 'alphabetic';

  // 각 줄 그리기 (letter-spacing 수동 적용)
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const y = (i + 1) * lh - fontSize * 0.18;

    let totalW = 0;
    const widths = [];
    for (const ch of line) {
      const w = ctx.measureText(ch).width;
      widths.push(w);
      totalW += w;
    }
    totalW += ls * (line.length - 1);

    let x = (W - totalW) / 2;
    for (let j = 0; j < line.length; j++) {
      ctx.fillText(line[j], x, y);
      x += widths[j] + ls;
    }
  }

  // 샘플링
  const data = ctx.getImageData(0, 0, W, H).data;
  const step = postitSpacing;
  const items = [];

  for (let y = 0; y < H; y += step) {
    for (let x = 0; x < W; x += step) {
      const idx = (y * W + x) * 4 + 3; // alpha 채널
      if (data[idx] > threshold) {
        items.push({ x, y });
      }
    }
  }

  return { items, width: W, height: H };
}

// ============================================
// 포스트잇 렌더링
// ============================================
function renderPostits(wrap, sample, opts) {
  const { postitSize, rotJitter, posJitter, scaleJitter, postitColor, borderColor, borderWidth } = opts;

  // 시드 기반 랜덤 (안정적인 레이아웃)
  let seed = 1 + (CONFIG.headline.length * 13) + Math.floor(postitSize * 7);
  const rng = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };

  let html = '';
  for (const it of sample.items) {
    const rot = (rng() * 2 - 1) * rotJitter;
    const ox = (rng() * 2 - 1) * posJitter;
    const oy = (rng() * 2 - 1) * posJitter;
    const sc = 1 + (rng() * 2 - 1) * scaleJitter;
    const px = it.x + ox - postitSize / 2;
    const py = it.y + oy - postitSize / 2;

    html += `<div class="postit" 
      data-ox="${ox.toFixed(1)}" data-oy="${oy.toFixed(1)}"
      data-rot="${rot.toFixed(1)}" data-sc="${sc.toFixed(3)}"
      style="
        left:${px.toFixed(1)}px;
        top:${py.toFixed(1)}px;
        width:${postitSize}px;
        height:${postitSize}px;
        transform:rotate(${rot.toFixed(1)}deg) scale(${sc.toFixed(3)});
        background:${postitColor};
        border:${borderWidth}px solid ${borderColor};
      "></div>`;
  }

  wrap.style.width = sample.width + 'px';
  wrap.style.height = sample.height + 'px';
  wrap.innerHTML = html;
}

// ============================================
// 인터랙션: 마우스 hover → 포스트잇 흩어짐
// ============================================
function setupInteraction(wrap) {
  const postits = wrap.querySelectorAll('.postit');
  const RADIUS = 120;
  const FORCE = 40;

  wrap.addEventListener('mousemove', (e) => {
    const rect = wrap.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    postits.forEach(p => {
      const px = parseFloat(p.style.left) + CONFIG.postitSize / 2;
      const py = parseFloat(p.style.top) + CONFIG.postitSize / 2;

      const dx = px - mx;
      const dy = py - my;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < RADIUS) {
        const factor = (1 - dist / RADIUS) * FORCE;
        const angle = Math.atan2(dy, dx);
        const pushX = Math.cos(angle) * factor;
        const pushY = Math.sin(angle) * factor;
        const rot = parseFloat(p.dataset.rot) + pushX * 0.5;
        const sc = parseFloat(p.dataset.sc);

        p.style.transform = `translate(${pushX.toFixed(1)}px, ${pushY.toFixed(1)}px) rotate(${rot.toFixed(1)}deg) scale(${sc})`;
      } else {
        // 원래 위치로 복귀
        const rot = p.dataset.rot;
        const sc = p.dataset.sc;
        p.style.transform = `rotate(${rot}deg) scale(${sc})`;
      }
    });
  });

  // 마우스 나가면 전부 원위치
  wrap.addEventListener('mouseleave', () => {
    postits.forEach(p => {
      const rot = p.dataset.rot;
      const sc = p.dataset.sc;
      p.style.transform = `rotate(${rot}deg) scale(${sc})`;
    });
  });
}

// ============================================
// 초기화
// ============================================
function init() {
  const wrap = document.getElementById('wrap');
  const stageW = Math.min(900, window.innerWidth - 80);

  const opts = {
    ...CONFIG,
    maxWidth: stageW,
  };

  // 폰트 로드 후 렌더링
  document.fonts.ready.then(() => {
    const sample = samplePostits(CONFIG.headline, opts);
    renderPostits(wrap, sample, opts);
    setupInteraction(wrap);
  });
}

init();

// 리사이즈 대응
window.addEventListener('resize', () => {
  init();
});
</script>

</body>
</html>
