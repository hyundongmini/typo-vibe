<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Post-it Type</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1A7CFF;
    --postit: #FFFFFF;
    --border: #1A7CFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    min-height: 100vh;
    overflow: hidden;
  }
  body {
    font-family: "Black Han Sans", "Noto Sans KR", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    perspective: 1200px;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 900px;
    padding: 48px 40px;
  }

  .canvas-wrap {
    position: relative;
    width: 100%;
    margin: 0 auto;
    transform-style: preserve-3d;
  }

  .postit {
    position: absolute;
    background: var(--postit);
    border: 1px solid var(--border);
    border-radius: 1px;
    pointer-events: none;
    box-shadow: 
      1px 2px 4px rgba(0,0,0,0.15),
      inset 0 0 0 0.5px rgba(0,0,0,0.05);
  }

  /* 떨어지는 포스트잇 - SVG 기반 유기적 종이 */
  .paper-falling {
    position: fixed;
    pointer-events: none;
    z-index: 100;
    opacity: 0;
  }

  .paper-falling.animate {
    animation: paper-drift var(--duration) cubic-bezier(0.2, 0.6, 0.4, 1) forwards;
    animation-delay: var(--delay);
  }

  @keyframes paper-drift {
    0% {
      opacity: 1;
      transform: translateY(0) translateX(0) rotate(0deg);
    }
    15% {
      opacity: 1;
      transform: translateY(12vh) translateX(var(--drift)) rotate(var(--rz-start));
    }
    35% {
      transform: translateY(30vh) translateX(calc(var(--drift) * -0.5)) rotate(calc(var(--rz-start) * -0.6));
    }
    55% {
      opacity: 0.9;
      transform: translateY(50vh) translateX(calc(var(--drift) * 0.4)) rotate(var(--rz-end));
    }
    75% {
      opacity: 0.6;
      transform: translateY(70vh) translateX(calc(var(--drift) * -0.2)) rotate(calc(var(--rz-end) * -0.4));
    }
    100% {
      opacity: 0;
      transform: translateY(100vh) translateX(0) rotate(var(--rz-end));
    }
  }

  .paper-falling.animate {
    animation: paper-fall var(--duration) cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    animation-delay: var(--delay);
  }

  @keyframes paper-fall {
    0% {
      opacity: 1;
      transform: 
        translateY(0)
        translateX(0)
        rotateX(0deg)
        rotateY(0deg)
        rotateZ(0deg);
    }
    10% {
      opacity: 1;
      transform: 
        translateY(8vh)
        translateX(calc(var(--drift) * 0.3))
        rotateX(calc(var(--rx) * 0.8))
        rotateY(calc(var(--ry) * 0.4))
        rotateZ(calc(var(--rz-start) * 0.5));
    }
    25% {
      transform: 
        translateY(20vh)
        translateX(var(--drift))
        rotateX(calc(var(--rx) * -0.6))
        rotateY(var(--ry))
        rotateZ(var(--rz-start));
    }
    40% {
      transform: 
        translateY(35vh)
        translateX(calc(var(--drift) * -0.4))
        rotateX(calc(var(--rx) * 0.5))
        rotateY(calc(var(--ry) * -0.7))
        rotateZ(calc(var(--rz-end) * 0.6));
    }
    55% {
      opacity: 0.9;
      transform: 
        translateY(50vh)
        translateX(calc(var(--drift) * 0.5))
        rotateX(calc(var(--rx) * -0.3))
        rotateY(calc(var(--ry) * 0.5))
        rotateZ(calc(var(--rz-start) * -0.4));
    }
    70% {
      opacity: 0.7;
      transform: 
        translateY(65vh)
        translateX(calc(var(--drift) * -0.2))
        rotateX(calc(var(--rx) * 0.2))
        rotateY(calc(var(--ry) * -0.3))
        rotateZ(var(--rz-end));
    }
    85% {
      opacity: 0.4;
      transform: 
        translateY(82vh)
        translateX(calc(var(--drift) * 0.1))
        rotateX(calc(var(--rx) * -0.1))
        rotateY(calc(var(--ry) * 0.1))
        rotateZ(calc(var(--rz-end) * -0.3));
    }
    100% {
      opacity: 0;
      transform: 
        translateY(105vh)
        translateX(0)
        rotateX(0deg)
        rotateY(0deg)
        rotateZ(var(--rz-end));
    }
  }

  .footnote {
    position: fixed;
    left: 40px;
    bottom: 30px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    line-height: 1.5;
    pointer-events: none;
  }

  .input-hint {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255,255,255,0.25);
    font-size: 20px;
    letter-spacing: 0.1em;
    pointer-events: none;
    transition: opacity 0.5s;
  }
  .input-hint.hidden { opacity: 0; }

  .stage::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(120% 80% at 50% 50%, transparent 60%, rgba(0,0,0,0.15) 100%);
  }

  #sampler { position: absolute; left: -99999px; top: 0; }

  .cursor-display {
    position: fixed;
    bottom: 30px;
    right: 40px;
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    letter-spacing: 0.03em;
  }
  .cursor-display span {
    animation: blink 1s step-end infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
</style>
</head>
<body>

<canvas id="sampler"></canvas>

<div class="stage">
  <div class="canvas-wrap" id="wrap"></div>
</div>

<div class="input-hint" id="hint">타이핑하세요</div>
<div class="cursor-display" id="cursor-display"><span>|</span></div>

<!-- 숨겨진 input (한글 조합 처리용) -->
<input type="text" id="hidden-input" autocomplete="off" autofocus
       style="position:fixed;top:-100px;left:0;opacity:0;pointer-events:none;">

<div class="footnote">
  WELTFORM.AT<br/>
  POSTITPOSTER.COM
</div>

<script>
// ============================================
// 설정
// ============================================
const CONFIG = {
  fontFamily: 'Black Han Sans',
  fontWeight: 900,
  letterSpacing: -3,
  lineHeight: 1.06,
  postitSize: 28,
  postitSpacing: 20,
  rotJitter: 34,
  posJitter: 6,
  scaleJitter: 0.16,
  threshold: 160,
};

let currentText = '';
let previousCount = 0;
let renderTimeout = null;

// ============================================
// 픽셀 샘플링
// ============================================
function samplePostits(text, maxWidth) {
  const canvas = document.getElementById('sampler');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  const lines = text.split('\n').filter(l => l.length > 0);
  if (lines.length === 0) return { items: [], width: 0, height: 0 };

  const measureSize = 200;
  ctx.font = `${CONFIG.fontWeight} ${measureSize}px ${CONFIG.fontFamily}, sans-serif`;
  ctx.textBaseline = 'alphabetic';

  let longest = 0;
  for (const l of lines) longest = Math.max(longest, ctx.measureText(l).width);

  const lsAtMeasure = CONFIG.letterSpacing * (measureSize / 100);
  const widestLineCharCount = Math.max(...lines.map(l => l.length));
  longest += lsAtMeasure * (widestLineCharCount - 1);

  const target = maxWidth * 0.94;
  const scale = target / Math.max(longest, 1);
  const fontSize = measureSize * scale;
  const ls = lsAtMeasure * scale;
  const lh = fontSize * CONFIG.lineHeight;

  const W = Math.ceil(maxWidth);
  const H = Math.ceil(lh * lines.length + fontSize * 0.3);
  canvas.width = W;
  canvas.height = H;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000';
  ctx.font = `${CONFIG.fontWeight} ${fontSize}px ${CONFIG.fontFamily}, sans-serif`;
  ctx.textBaseline = 'alphabetic';

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const y = (i + 1) * lh - fontSize * 0.18;

    let totalW = 0;
    const widths = [];
    for (const ch of line) {
      const w = ctx.measureText(ch).width;
      widths.push(w);
      totalW += w;
    }
    totalW += ls * (line.length - 1);

    let x = (W - totalW) / 2;
    for (let j = 0; j < line.length; j++) {
      ctx.fillText(line[j], x, y);
      x += widths[j] + ls;
    }
  }

  const data = ctx.getImageData(0, 0, W, H).data;
  const step = CONFIG.postitSpacing;
  const items = [];

  for (let y = 0; y < H; y += step) {
    for (let x = 0; x < W; x += step) {
      const idx = (y * W + x) * 4 + 3;
      if (data[idx] > CONFIG.threshold) {
        items.push({ x, y });
      }
    }
  }

  return { items, width: W, height: H };
}

// ============================================
// 시드 랜덤
// ============================================
function makeRng(seed) {
  return () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
}

// ============================================
// 렌더링 (글자는 즉시, 여분 종이만 떨어짐)
// ============================================
function render() {
  const wrap = document.getElementById('wrap');
  const stageW = Math.min(900, window.innerWidth - 80);

  if (currentText.length === 0) {
    wrap.innerHTML = '';
    wrap.style.width = '0';
    wrap.style.height = '0';
    previousCount = 0;
    return;
  }

  const sample = samplePostits(currentText, stageW);
  const { postitSize, rotJitter, posJitter, scaleJitter } = CONFIG;

  const rng = makeRng(1 + (currentText.length * 13) + Math.floor(postitSize * 7));

  let html = '';
  sample.items.forEach((it, idx) => {
    const rot = (rng() * 2 - 1) * rotJitter;
    const ox = (rng() * 2 - 1) * posJitter;
    const oy = (rng() * 2 - 1) * posJitter;
    const sc = 1 + (rng() * 2 - 1) * scaleJitter;
    const px = it.x + ox - postitSize / 2;
    const py = it.y + oy - postitSize / 2;

    // 모든 포스트잇 즉시 표시
    html += `<div class="postit" style="
      left:${px.toFixed(1)}px;
      top:${py.toFixed(1)}px;
      width:${postitSize}px;
      height:${postitSize}px;
      transform: rotateZ(${rot.toFixed(1)}deg) scale(${sc.toFixed(3)});
    "></div>`;
  });

  wrap.style.width = sample.width + 'px';
  wrap.style.height = sample.height + 'px';
  wrap.innerHTML = html;

  // 새 글자가 추가됐을 때만 여분 종이 떨어뜨리기
  if (sample.items.length > previousCount && previousCount >= 0) {
    spawnFallingPapers(5 + Math.floor(Math.random() * 3)); // 5~7장
  }

  previousCount = sample.items.length;
}

// ============================================
// 글자에 붙어있던 포스트잇이 떨어져 나감 (SVG 유기적 종이)
// ============================================
function spawnFallingPapers(count) {
  const wrap = document.getElementById('wrap');
  const postits = wrap.querySelectorAll('.postit');
  
  if (postits.length < count) return;
  
  const indices = [];
  while (indices.length < count) {
    const idx = Math.floor(Math.random() * postits.length);
    if (!indices.includes(idx)) indices.push(idx);
  }
  
  indices.forEach((idx, i) => {
    const source = postits[idx];
    const rect = source.getBoundingClientRect();
    
    const container = document.createElement('div');
    container.className = 'paper-falling';
    
    const size = rect.width * 1.5; // 약간 크게
    const drift = (Math.random() - 0.5) * 100;
    const rzStart = (Math.random() - 0.5) * 40;
    const rzEnd = (Math.random() - 0.5) * 30;
    const duration = 3 + Math.random() * 2;
    const delay = i * 200;
    
    // SVG로 유기적 종이 모양 생성
    const svg = createPaperSVG(size);
    
    container.style.cssText = `
      left: ${rect.left}px;
      top: ${rect.top}px;
      width: ${size}px;
      height: ${size}px;
      --drift: ${drift.toFixed(0)}px;
      --rz-start: ${rzStart.toFixed(0)}deg;
      --rz-end: ${rzEnd.toFixed(0)}deg;
      --duration: ${duration.toFixed(2)}s;
      --delay: ${delay}ms;
    `;
    
    container.appendChild(svg);
    document.body.appendChild(container);
    requestAnimationFrame(() => container.classList.add('animate'));

    setTimeout(() => container.remove(), (duration * 1000) + delay + 200);
  });
}

// ============================================
// SVG 유기적 종이 모양 생성
// ============================================
function createPaperSVG(size) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.setAttribute('viewBox', '0 0 100 100');
  svg.style.overflow = 'visible';
  
  // 랜덤 종이 형태 (모서리 접힘, 휘어짐)
  const type = Math.floor(Math.random() * 4);
  
  let pathData, foldPath, shadowPath;
  
  switch(type) {
    case 0:
      // 모서리 하나 접힌 종이
      pathData = 'M 15,5 L 85,8 L 82,70 L 70,72 L 68,85 L 12,80 Z';
      foldPath = 'M 70,72 L 82,70 L 80,82 Z';
      shadowPath = 'M 70,72 L 68,85 L 80,82 Z';
      break;
    case 1:
      // 위쪽이 말린 종이
      pathData = 'M 10,20 Q 30,5 50,8 Q 70,5 90,18 L 88,85 L 12,82 Z';
      foldPath = 'M 10,20 Q 30,12 50,14 Q 70,12 90,18 L 88,22 Q 70,16 50,18 Q 30,16 12,22 Z';
      shadowPath = null;
      break;
    case 2:
      // 살짝 기울어진 평평한 종이 (원근감)
      pathData = 'M 8,12 L 92,8 L 95,88 L 5,92 Z';
      foldPath = null;
      shadowPath = null;
      break;
    case 3:
      // 모서리 두 개 접힌 종이
      pathData = 'M 20,5 L 80,8 L 85,65 L 75,68 L 72,85 L 25,88 L 22,75 L 12,72 Z';
      foldPath = 'M 85,65 L 75,68 L 78,78 Z';
      shadowPath = 'M 12,72 L 22,75 L 18,82 Z';
      break;
  }
  
  // 메인 종이
  const paper = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  paper.setAttribute('d', pathData);
  paper.setAttribute('fill', '#FFFFFF');
  paper.setAttribute('stroke', '#1A7CFF');
  paper.setAttribute('stroke-width', '1.5');
  svg.appendChild(paper);
  
  // 접힌 부분 (밝은 회색)
  if (foldPath) {
    const fold = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    fold.setAttribute('d', foldPath);
    fold.setAttribute('fill', '#e8e8e8');
    fold.setAttribute('stroke', '#1A7CFF');
    fold.setAttribute('stroke-width', '1');
    svg.appendChild(fold);
  }
  
  // 그림자 부분 (뒷면 비침)
  if (shadowPath) {
    const shadow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    shadow.setAttribute('d', shadowPath);
    shadow.setAttribute('fill', '#d0d0d0');
    shadow.setAttribute('stroke', '#1A7CFF');
    shadow.setAttribute('stroke-width', '0.8');
    svg.appendChild(shadow);
  }
  
  // SVG 내부 흔들림 애니메이션 (종이 자체가 유기적으로 변형)
  const animDuration = (2 + Math.random() * 2).toFixed(2);
  const animate = document.createElementNS('http://www.w3.org/2000/svg', 'animateTransform');
  animate.setAttribute('attributeName', 'transform');
  animate.setAttribute('type', 'rotate');
  animate.setAttribute('values', `0 50 50; ${10 + Math.random() * 15} 50 50; ${-(10 + Math.random() * 15)} 50 50; 0 50 50`);
  animate.setAttribute('dur', animDuration + 's');
  animate.setAttribute('repeatCount', 'indefinite');
  paper.appendChild(animate);
  
  return svg;
}

// ============================================
// 키보드 입력 (한글 조합 지원)
// ============================================
const hint = document.getElementById('hint');
const cursorDisplay = document.getElementById('cursor-display');
const hiddenInput = document.getElementById('hidden-input');

// 페이지 클릭 시 input에 포커스
document.addEventListener('click', () => hiddenInput.focus());
hiddenInput.focus();

// input 이벤트로 한글 조합 처리
hiddenInput.addEventListener('input', (e) => {
  hint.classList.add('hidden');
  
  const newText = hiddenInput.value;
  
  // 텍스트가 변경됐을 때만 렌더링
  if (newText !== currentText) {
    const wasLonger = newText.length > currentText.length;
    currentText = newText;
    
    cursorDisplay.innerHTML = currentText.replace(/\n/g, '↵') + '<span>|</span>';
    
    // 글자가 추가됐을 때만 종이 떨어뜨리기
    if (wasLonger && currentText.length > 0 && currentText.length % 2 === 0) {
      spawnFallingPapers(5 + Math.floor(Math.random() * 3));
    }
    
    if (renderTimeout) clearTimeout(renderTimeout);
    renderTimeout = setTimeout(() => render(), 30);
  }
});

// Enter 키 처리
hiddenInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    hiddenInput.value += '\n';
    hiddenInput.dispatchEvent(new Event('input'));
  }
});

// 폰트 로드 후 대기
document.fonts.ready.then(() => {
  // 빈 상태로 시작
});

window.addEventListener('resize', () => {
  previousCount = 0;
  render();
});
</script>

</body>
</html>
