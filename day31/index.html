<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Post-it Type</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1A7CFF;
    --postit: #FFFFFF;
    --border: #1A7CFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    min-height: 100vh;
    overflow: hidden;
  }
  body {
    font-family: "Black Han Sans", "Noto Sans KR", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    perspective: 1200px;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 900px;
    padding: 48px 40px;
  }

  .canvas-wrap {
    position: relative;
    width: 100%;
    margin: 0 auto;
    transform-style: preserve-3d;
  }

  .postit {
    position: absolute;
    background: var(--postit);
    border: 1px solid var(--border);
    border-radius: 1px;
    pointer-events: none;
    box-shadow: 
      1px 2px 4px rgba(0,0,0,0.15),
      inset 0 0 0 0.5px rgba(0,0,0,0.05);
  }

  /* 떨어지는 여분 종이 */
  .paper-falling {
    position: absolute;
    background: var(--postit);
    border: 1px solid var(--border);
    border-radius: 1px;
    pointer-events: none;
    transform-style: preserve-3d;
    box-shadow: 1px 2px 6px rgba(0,0,0,0.2);
    animation: paper-fall var(--duration) ease-in forwards;
    animation-delay: var(--delay);
    opacity: 0;
  }

  @keyframes paper-fall {
    0% {
      opacity: 1;
      transform: 
        translateY(var(--start-y))
        translateX(var(--start-x))
        rotateX(var(--rx))
        rotateY(var(--ry))
        rotateZ(var(--rz-start));
    }
    25% {
      opacity: 1;
      transform: 
        translateY(calc(var(--start-y) + 25vh))
        translateX(calc(var(--start-x) + var(--drift)))
        rotateX(calc(var(--rx) * -0.5))
        rotateY(calc(var(--ry) * -0.7))
        rotateZ(calc(var(--rz-start) * -0.3));
    }
    50% {
      opacity: 0.9;
      transform: 
        translateY(calc(var(--start-y) + 55vh))
        translateX(calc(var(--start-x) - var(--drift) * 0.5))
        rotateX(calc(var(--rx) * 0.3))
        rotateY(calc(var(--ry) * 0.5))
        rotateZ(var(--rz-end));
    }
    75% {
      opacity: 0.7;
      transform: 
        translateY(calc(var(--start-y) + 80vh))
        translateX(calc(var(--start-x) + var(--drift) * 0.3))
        rotateX(calc(var(--rx) * -0.2))
        rotateY(calc(var(--ry) * -0.3))
        rotateZ(calc(var(--rz-end) * -0.5));
    }
    100% {
      opacity: 0;
      transform: 
        translateY(calc(var(--start-y) + 110vh))
        translateX(var(--start-x))
        rotateX(0deg)
        rotateY(0deg)
        rotateZ(var(--rz-end));
    }
  }

  .footnote {
    position: fixed;
    left: 40px;
    bottom: 30px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    line-height: 1.5;
    pointer-events: none;
  }

  .input-hint {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255,255,255,0.25);
    font-size: 20px;
    letter-spacing: 0.1em;
    pointer-events: none;
    transition: opacity 0.5s;
  }
  .input-hint.hidden { opacity: 0; }

  .stage::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(120% 80% at 50% 50%, transparent 60%, rgba(0,0,0,0.15) 100%);
  }

  #sampler { position: absolute; left: -99999px; top: 0; }

  .cursor-display {
    position: fixed;
    bottom: 30px;
    right: 40px;
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    letter-spacing: 0.03em;
  }
  .cursor-display span {
    animation: blink 1s step-end infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
</style>
</head>
<body>

<canvas id="sampler"></canvas>

<div class="stage">
  <div class="canvas-wrap" id="wrap"></div>
</div>

<div class="input-hint" id="hint">타이핑하세요</div>
<div class="cursor-display" id="cursor-display"><span>|</span></div>

<div class="footnote">
  WELTFORM.AT<br/>
  POSTITPOSTER.COM
</div>

<script>
// ============================================
// 설정
// ============================================
const CONFIG = {
  fontFamily: 'Black Han Sans',
  fontWeight: 900,
  letterSpacing: -3,
  lineHeight: 1.06,
  postitSize: 22,
  postitSpacing: 13,
  rotJitter: 34,
  posJitter: 6,
  scaleJitter: 0.16,
  threshold: 140,
};

let currentText = '';
let previousCount = 0;
let renderTimeout = null;

// ============================================
// 픽셀 샘플링
// ============================================
function samplePostits(text, maxWidth) {
  const canvas = document.getElementById('sampler');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  const lines = text.split('\n').filter(l => l.length > 0);
  if (lines.length === 0) return { items: [], width: 0, height: 0 };

  const measureSize = 200;
  ctx.font = `${CONFIG.fontWeight} ${measureSize}px ${CONFIG.fontFamily}, sans-serif`;
  ctx.textBaseline = 'alphabetic';

  let longest = 0;
  for (const l of lines) longest = Math.max(longest, ctx.measureText(l).width);

  const lsAtMeasure = CONFIG.letterSpacing * (measureSize / 100);
  const widestLineCharCount = Math.max(...lines.map(l => l.length));
  longest += lsAtMeasure * (widestLineCharCount - 1);

  const target = maxWidth * 0.94;
  const scale = target / Math.max(longest, 1);
  const fontSize = measureSize * scale;
  const ls = lsAtMeasure * scale;
  const lh = fontSize * CONFIG.lineHeight;

  const W = Math.ceil(maxWidth);
  const H = Math.ceil(lh * lines.length + fontSize * 0.3);
  canvas.width = W;
  canvas.height = H;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000';
  ctx.font = `${CONFIG.fontWeight} ${fontSize}px ${CONFIG.fontFamily}, sans-serif`;
  ctx.textBaseline = 'alphabetic';

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const y = (i + 1) * lh - fontSize * 0.18;

    let totalW = 0;
    const widths = [];
    for (const ch of line) {
      const w = ctx.measureText(ch).width;
      widths.push(w);
      totalW += w;
    }
    totalW += ls * (line.length - 1);

    let x = (W - totalW) / 2;
    for (let j = 0; j < line.length; j++) {
      ctx.fillText(line[j], x, y);
      x += widths[j] + ls;
    }
  }

  const data = ctx.getImageData(0, 0, W, H).data;
  const step = CONFIG.postitSpacing;
  const items = [];

  for (let y = 0; y < H; y += step) {
    for (let x = 0; x < W; x += step) {
      const idx = (y * W + x) * 4 + 3;
      if (data[idx] > CONFIG.threshold) {
        items.push({ x, y });
      }
    }
  }

  return { items, width: W, height: H };
}

// ============================================
// 시드 랜덤
// ============================================
function makeRng(seed) {
  return () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
}

// ============================================
// 렌더링 (글자는 즉시, 여분 종이만 떨어짐)
// ============================================
function render() {
  const wrap = document.getElementById('wrap');
  const stageW = Math.min(900, window.innerWidth - 80);

  if (currentText.length === 0) {
    wrap.innerHTML = '';
    wrap.style.width = '0';
    wrap.style.height = '0';
    previousCount = 0;
    return;
  }

  const sample = samplePostits(currentText, stageW);
  const { postitSize, rotJitter, posJitter, scaleJitter } = CONFIG;

  const rng = makeRng(1 + (currentText.length * 13) + Math.floor(postitSize * 7));

  let html = '';
  sample.items.forEach((it, idx) => {
    const rot = (rng() * 2 - 1) * rotJitter;
    const ox = (rng() * 2 - 1) * posJitter;
    const oy = (rng() * 2 - 1) * posJitter;
    const sc = 1 + (rng() * 2 - 1) * scaleJitter;
    const px = it.x + ox - postitSize / 2;
    const py = it.y + oy - postitSize / 2;

    // 모든 포스트잇 즉시 표시
    html += `<div class="postit" style="
      left:${px.toFixed(1)}px;
      top:${py.toFixed(1)}px;
      width:${postitSize}px;
      height:${postitSize}px;
      transform: rotateZ(${rot.toFixed(1)}deg) scale(${sc.toFixed(3)});
    "></div>`;
  });

  wrap.style.width = sample.width + 'px';
  wrap.style.height = sample.height + 'px';
  wrap.innerHTML = html;

  // 새 글자가 추가됐을 때만 여분 종이 떨어뜨리기
  if (sample.items.length > previousCount && previousCount >= 0) {
    spawnFallingPapers(5 + Math.floor(Math.random() * 3)); // 5~7장
  }

  previousCount = sample.items.length;
}

// ============================================
// 여분 종이 떨어뜨리기 (5~7장)
// ============================================
function spawnFallingPapers(count) {
  const wrap = document.getElementById('wrap');
  const wrapRect = wrap.getBoundingClientRect();
  
  for (let i = 0; i < count; i++) {
    const paper = document.createElement('div');
    paper.className = 'paper-falling';
    
    const size = CONFIG.postitSize * (0.8 + Math.random() * 0.6); // 크기 랜덤
    const startX = (Math.random() - 0.5) * wrapRect.width * 0.8;
    const startY = -50 - Math.random() * 100;
    const drift = (Math.random() - 0.5) * 100;
    const rx = (Math.random() - 0.5) * 180;
    const ry = (Math.random() - 0.5) * 120;
    const rzStart = (Math.random() - 0.5) * 90;
    const rzEnd = (Math.random() - 0.5) * 60;
    const duration = 2 + Math.random() * 1.5; // 2~3.5초
    const delay = i * 150; // 150ms 간격

    paper.style.cssText = `
      left: 50%;
      top: 0;
      width: ${size.toFixed(0)}px;
      height: ${size.toFixed(0)}px;
      --start-x: ${startX.toFixed(0)}px;
      --start-y: ${startY.toFixed(0)}px;
      --drift: ${drift.toFixed(0)}px;
      --rx: ${rx.toFixed(0)}deg;
      --ry: ${ry.toFixed(0)}deg;
      --rz-start: ${rzStart.toFixed(0)}deg;
      --rz-end: ${rzEnd.toFixed(0)}deg;
      --duration: ${duration.toFixed(2)}s;
      --delay: ${delay}ms;
      animation-delay: ${delay}ms;
      animation-duration: ${duration.toFixed(2)}s;
    `;

    wrap.appendChild(paper);

    // 애니메이션 끝나면 제거
    setTimeout(() => paper.remove(), (duration + delay / 1000) * 1000 + 200);
  }
}

// ============================================
// 키보드 입력
// ============================================
const hint = document.getElementById('hint');
const cursorDisplay = document.getElementById('cursor-display');

document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Tab' || e.key === 'Escape') return;

  hint.classList.add('hidden');

  if (e.key === 'Backspace') {
    currentText = currentText.slice(0, -1);
    previousCount = 0; // 전체 다시 그리기 (떨어지는 효과 없이)
  } else if (e.key === 'Enter') {
    currentText += '\n';
  } else if (e.key.length === 1) {
    currentText += e.key;
  } else {
    return;
  }

  cursorDisplay.innerHTML = currentText.replace(/\n/g, '↵') + '<span>|</span>';

  // 디바운스 (빠른 타이핑 대응)
  if (renderTimeout) clearTimeout(renderTimeout);
  renderTimeout = setTimeout(() => render(), 50);
});

// 폰트 로드 후 대기
document.fonts.ready.then(() => {
  // 빈 상태로 시작
});

window.addEventListener('resize', () => {
  previousCount = 0;
  render();
});
</script>

</body>
</html>
