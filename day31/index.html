<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Post-it Type</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1A7CFF;
    --postit: #FFFFFF;
    --border: #1A7CFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    min-height: 100vh;
    overflow: hidden;
  }
  body {
    font-family: "Black Han Sans", "Noto Sans KR", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    perspective: 1200px;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 900px;
    padding: 48px 40px;
  }

  .canvas-wrap {
    position: relative;
    width: 100%;
    margin: 0 auto;
    transform-style: preserve-3d;
  }

  .postit {
    position: absolute;
    background: var(--postit);
    border: 1px solid var(--border);
    border-radius: 1px;
    pointer-events: none;
    box-shadow: 
      1px 2px 4px rgba(0,0,0,0.15),
      inset 0 0 0 0.5px rgba(0,0,0,0.05);
  }

  /* 새로 추가되는 포스트잇: 위에서 떨어져서 제자리에 안착 */
  .postit.new {
    opacity: 0;
    animation: postit-land var(--fall-duration) cubic-bezier(0.4, 0, 0.2, 1) forwards;
    animation-delay: var(--fall-delay);
  }

  @keyframes postit-land {
    0% {
      opacity: 1;
      transform: 
        translateY(var(--fall-from))
        translateX(var(--fall-drift))
        rotateZ(var(--fall-rz-start));
    }
    40% {
      opacity: 1;
      transform: 
        translateY(calc(var(--fall-from) * 0.3))
        translateX(calc(var(--fall-drift) * -0.4))
        rotateZ(calc(var(--fall-rz-start) * -0.3));
    }
    70% {
      transform: 
        translateY(-5px)
        translateX(calc(var(--fall-drift) * 0.1))
        rotateZ(calc(var(--final-rot) + 3deg));
    }
    100% {
      opacity: 1;
      transform: 
        translateY(0)
        translateX(0)
        rotateZ(var(--final-rot))
        scale(var(--final-sc));
    }
  }

  .paper-falling.animate {
    animation: paper-fall var(--duration) cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    animation-delay: var(--delay);
  }

  @keyframes paper-fall {
    0% {
      opacity: 1;
      transform: 
        translateY(0)
        translateX(0)
        rotateX(0deg)
        rotateY(0deg)
        rotateZ(0deg);
    }
    10% {
      opacity: 1;
      transform: 
        translateY(8vh)
        translateX(calc(var(--drift) * 0.3))
        rotateX(calc(var(--rx) * 0.8))
        rotateY(calc(var(--ry) * 0.4))
        rotateZ(calc(var(--rz-start) * 0.5));
    }
    25% {
      transform: 
        translateY(20vh)
        translateX(var(--drift))
        rotateX(calc(var(--rx) * -0.6))
        rotateY(var(--ry))
        rotateZ(var(--rz-start));
    }
    40% {
      transform: 
        translateY(35vh)
        translateX(calc(var(--drift) * -0.4))
        rotateX(calc(var(--rx) * 0.5))
        rotateY(calc(var(--ry) * -0.7))
        rotateZ(calc(var(--rz-end) * 0.6));
    }
    55% {
      opacity: 0.9;
      transform: 
        translateY(50vh)
        translateX(calc(var(--drift) * 0.5))
        rotateX(calc(var(--rx) * -0.3))
        rotateY(calc(var(--ry) * 0.5))
        rotateZ(calc(var(--rz-start) * -0.4));
    }
    70% {
      opacity: 0.7;
      transform: 
        translateY(65vh)
        translateX(calc(var(--drift) * -0.2))
        rotateX(calc(var(--rx) * 0.2))
        rotateY(calc(var(--ry) * -0.3))
        rotateZ(var(--rz-end));
    }
    85% {
      opacity: 0.4;
      transform: 
        translateY(82vh)
        translateX(calc(var(--drift) * 0.1))
        rotateX(calc(var(--rx) * -0.1))
        rotateY(calc(var(--ry) * 0.1))
        rotateZ(calc(var(--rz-end) * -0.3));
    }
    100% {
      opacity: 0;
      transform: 
        translateY(105vh)
        translateX(0)
        rotateX(0deg)
        rotateY(0deg)
        rotateZ(var(--rz-end));
    }
  }

  .footnote {
    position: fixed;
    left: 40px;
    bottom: 30px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    line-height: 1.5;
    pointer-events: none;
  }

  .input-hint {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255,255,255,0.25);
    font-size: 20px;
    letter-spacing: 0.1em;
    pointer-events: none;
    transition: opacity 0.5s;
  }
  .input-hint.hidden { opacity: 0; }

  .stage::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(120% 80% at 50% 50%, transparent 60%, rgba(0,0,0,0.15) 100%);
  }

  #sampler { position: absolute; left: -99999px; top: 0; }

  .cursor-display {
    position: fixed;
    bottom: 30px;
    right: 40px;
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    letter-spacing: 0.03em;
  }
  .cursor-display span {
    animation: blink 1s step-end infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
</style>
</head>
<body>

<canvas id="sampler"></canvas>

<div class="stage">
  <div class="canvas-wrap" id="wrap"></div>
</div>

<div class="input-hint" id="hint">타이핑하세요</div>
<div class="cursor-display" id="cursor-display"><span>|</span></div>

<!-- 숨겨진 input (한글 조합 처리용) -->
<input type="text" id="hidden-input" autocomplete="off" autofocus
       style="position:fixed;top:-100px;left:0;opacity:0;pointer-events:none;">

<div class="footnote">
  WELTFORM.AT<br/>
  POSTITPOSTER.COM
</div>

<script>
// ============================================
// 설정
// ============================================
const CONFIG = {
  fontFamily: 'Black Han Sans',
  fontWeight: 900,
  letterSpacing: -3,
  lineHeight: 1.06,
  postitSize: 28,
  postitSpacing: 20,
  rotJitter: 34,
  posJitter: 6,
  scaleJitter: 0.16,
  threshold: 160,
};

let currentText = '';
let previousCount = 0;
let renderTimeout = null;

// ============================================
// 픽셀 샘플링
// ============================================
function samplePostits(text, maxWidth) {
  const canvas = document.getElementById('sampler');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  const lines = text.split('\n').filter(l => l.length > 0);
  if (lines.length === 0) return { items: [], width: 0, height: 0 };

  const measureSize = 200;
  ctx.font = `${CONFIG.fontWeight} ${measureSize}px ${CONFIG.fontFamily}, sans-serif`;
  ctx.textBaseline = 'alphabetic';

  let longest = 0;
  for (const l of lines) longest = Math.max(longest, ctx.measureText(l).width);

  const lsAtMeasure = CONFIG.letterSpacing * (measureSize / 100);
  const widestLineCharCount = Math.max(...lines.map(l => l.length));
  longest += lsAtMeasure * (widestLineCharCount - 1);

  const target = maxWidth * 0.94;
  const scale = target / Math.max(longest, 1);
  const fontSize = measureSize * scale;
  const ls = lsAtMeasure * scale;
  const lh = fontSize * CONFIG.lineHeight;

  const W = Math.ceil(maxWidth);
  const H = Math.ceil(lh * lines.length + fontSize * 0.3);
  canvas.width = W;
  canvas.height = H;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000';
  ctx.font = `${CONFIG.fontWeight} ${fontSize}px ${CONFIG.fontFamily}, sans-serif`;
  ctx.textBaseline = 'alphabetic';

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const y = (i + 1) * lh - fontSize * 0.18;

    let totalW = 0;
    const widths = [];
    for (const ch of line) {
      const w = ctx.measureText(ch).width;
      widths.push(w);
      totalW += w;
    }
    totalW += ls * (line.length - 1);

    let x = (W - totalW) / 2;
    for (let j = 0; j < line.length; j++) {
      ctx.fillText(line[j], x, y);
      x += widths[j] + ls;
    }
  }

  const data = ctx.getImageData(0, 0, W, H).data;
  const step = CONFIG.postitSpacing;
  const items = [];

  for (let y = 0; y < H; y += step) {
    for (let x = 0; x < W; x += step) {
      const idx = (y * W + x) * 4 + 3;
      if (data[idx] > CONFIG.threshold) {
        items.push({ x, y });
      }
    }
  }

  return { items, width: W, height: H };
}

// ============================================
// 시드 랜덤
// ============================================
function makeRng(seed) {
  return () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
}

// ============================================
// 렌더링 (글자는 즉시, 여분 종이만 떨어짐)
// ============================================
function render() {
  const wrap = document.getElementById('wrap');
  const stageW = Math.min(900, window.innerWidth - 80);

  if (currentText.length === 0) {
    wrap.innerHTML = '';
    wrap.style.width = '0';
    wrap.style.height = '0';
    previousCount = 0;
    return;
  }

  const sample = samplePostits(currentText, stageW);
  const { postitSize, rotJitter, posJitter, scaleJitter } = CONFIG;

  const rng = makeRng(1 + (currentText.length * 13) + Math.floor(postitSize * 7));

  let html = '';
  sample.items.forEach((it, idx) => {
    const rot = (rng() * 2 - 1) * rotJitter;
    const ox = (rng() * 2 - 1) * posJitter;
    const oy = (rng() * 2 - 1) * posJitter;
    const sc = 1 + (rng() * 2 - 1) * scaleJitter;
    const px = it.x + ox - postitSize / 2;
    const py = it.y + oy - postitSize / 2;

    const isNew = idx >= previousCount;

    if (isNew) {
      // 새 포스트잇: 위에서 떨어져서 제자리에 안착
      const fallFrom = -80 - Math.random() * 120;
      const fallDrift = (rng() * 2 - 1) * 30;
      const fallRzStart = (rng() * 2 - 1) * 30;
      const fallDelay = (idx - previousCount) * 12;
      const fallDuration = 0.5 + rng() * 0.3;

      html += `<div class="postit new" style="
        left:${px.toFixed(1)}px;
        top:${py.toFixed(1)}px;
        width:${postitSize}px;
        height:${postitSize}px;
        --fall-from:${fallFrom.toFixed(0)}px;
        --fall-drift:${fallDrift.toFixed(0)}px;
        --fall-rz-start:${fallRzStart.toFixed(0)}deg;
        --final-rot:${rot.toFixed(1)}deg;
        --final-sc:${sc.toFixed(3)};
        --fall-delay:${fallDelay}ms;
        --fall-duration:${fallDuration.toFixed(2)}s;
      "></div>`;
    } else {
      // 기존 포스트잇: 즉시 표시
      html += `<div class="postit" style="
        left:${px.toFixed(1)}px;
        top:${py.toFixed(1)}px;
        width:${postitSize}px;
        height:${postitSize}px;
        transform: rotateZ(${rot.toFixed(1)}deg) scale(${sc.toFixed(3)});
      "></div>`;
    }
  });

  wrap.style.width = sample.width + 'px';
  wrap.style.height = sample.height + 'px';
  wrap.innerHTML = html;

  previousCount = sample.items.length;
}

// ============================================
// 키보드 입력 (한글 조합 지원)
// ============================================
const hint = document.getElementById('hint');
const cursorDisplay = document.getElementById('cursor-display');
const hiddenInput = document.getElementById('hidden-input');

// 페이지 클릭 시 input에 포커스
document.addEventListener('click', () => hiddenInput.focus());
hiddenInput.focus();

// input 이벤트로 한글 조합 처리
hiddenInput.addEventListener('input', (e) => {
  hint.classList.add('hidden');
  
  const newText = hiddenInput.value;
  
  // 텍스트가 변경됐을 때만 렌더링
  if (newText !== currentText) {
    const wasLonger = newText.length > currentText.length;
    currentText = newText;
    
    cursorDisplay.innerHTML = currentText.replace(/\n/g, '↵') + '<span>|</span>';
    
    // 글자가 추가됐을 때 렌더링
    if (renderTimeout) clearTimeout(renderTimeout);
    renderTimeout = setTimeout(() => render(), 30);
  }
});

// Enter 키 처리
hiddenInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    hiddenInput.value += '\n';
    hiddenInput.dispatchEvent(new Event('input'));
  }
});

// 폰트 로드 후 대기
document.fonts.ready.then(() => {
  // 빈 상태로 시작
});

window.addEventListener('resize', () => {
  previousCount = 0;
  render();
});
</script>

</body>
</html>
