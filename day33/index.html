<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비정형 브러시 타이포</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }

  svg {
    width: 100vw;
    height: 100vh;
    position: fixed;
    top: 0;
    left: 0;
  }

  /* 컨트롤 패널 */
  .controls {
    position: fixed;
    top: 16px;
    right: 16px;
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 11px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 200px;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .controls h3 {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    opacity: 0.5;
    margin-bottom: 4px;
  }
  .controls label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .controls input[type=range] { flex: 1; height: 4px; }
  .controls input[type=text] {
    width: 100%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 12px;
    outline: none;
  }
  .controls .val {
    font-variant-numeric: tabular-nums;
    min-width: 28px;
    text-align: right;
    opacity: 0.6;
  }
  .controls button {
    padding: 6px 12px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
  }
  .controls button:hover { background: rgba(255,255,255,0.25); }
</style>
</head>
<body>

<!-- ============================================
  SVG 구조:
  1. <defs>에 feTurbulence + feDisplacementMap 필터 정의
  2. 4개 텍스트 레이어를 각각 다른 색/오프셋으로 겹침
  3. 결과: 색수차 + 비정형 브러시 효과
============================================ -->
<svg id="svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- 
      feTurbulence: Perlin noise 생성
      - type="turbulence": 더 거친 패턴 (fractalNoise보다 날카로움)
      - baseFrequency: 노이즈 촘촘함 (작을수록 큰 물결, 클수록 잔잔)
      - numOctaves: 디테일 레이어 수
      - seed: 패턴 시드 (바꾸면 완전히 다른 모양)
      
      feDisplacementMap: 노이즈를 이용해 이미지 왜곡
      - in: 왜곡할 대상 (SourceGraphic = 텍스트)
      - in2: 왜곡 맵 (위에서 만든 noise)
      - scale: 왜곡 강도 (클수록 더 구불구불)
      - xChannelSelector/yChannelSelector: R/G 채널로 X/Y축 왜곡
    -->
    <filter id="brush-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence 
        id="turbulence"
        type="turbulence" 
        baseFrequency="0.015" 
        numOctaves="3" 
        seed="42" 
        result="noise"/>
      <feDisplacementMap 
        id="displacement"
        in="SourceGraphic" 
        in2="noise" 
        scale="25" 
        xChannelSelector="R" 
        yChannelSelector="G"/>
    </filter>

    <!-- 그라데이션: 파랑 → 흰 → 초록 (세로 방향) -->
    <linearGradient id="brushGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0085ff"/>
      <stop offset="50%" stop-color="#fceeff"/>
      <stop offset="100%" stop-color="#39ff4a"/>
    </linearGradient>
  </defs>

  <!-- 
    레이어 구성 (뒤에서 앞으로):
    1. 파랑 레이어: 왼쪽 위로 offset → 색수차의 "파랑 채널"
    2. 초록 레이어: 오른쪽 아래로 offset → 색수차의 "초록 채널"
    3. 핑크/메인 레이어: 중앙 → 주 색상
    4. 그라데이션 레이어: 중앙, 얇은 선 → 디테일/하이라이트
  -->
  <g filter="url(#brush-filter)">
    <!-- 레이어 1: 파랑 (뒤쪽, 두꺼운 선, 왼쪽위 offset) -->
    <text id="layer1" 
          x="600" y="420" 
          text-anchor="middle" 
          font-family="'Arial Black', 'Impact', sans-serif"
          font-size="180" 
          font-weight="900"
          fill="none" 
          stroke="#0066ff" 
          stroke-width="8"
          stroke-linecap="round"
          stroke-linejoin="round"
          transform="translate(-6,-5)">비정형</text>

    <!-- 레이어 2: 초록 (중간, 중간 선, 오른쪽아래 offset) -->
    <text id="layer2" 
          x="600" y="420" 
          text-anchor="middle" 
          font-family="'Arial Black', 'Impact', sans-serif"
          font-size="180" 
          font-weight="900"
          fill="none" 
          stroke="#00cc44" 
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"
          transform="translate(6,5)">비정형</text>

    <!-- 레이어 3: 핑크/메인 (앞쪽, 중간 선, 중앙) -->
    <text id="layer3" 
          x="600" y="420" 
          text-anchor="middle" 
          font-family="'Arial Black', 'Impact', sans-serif"
          font-size="180" 
          font-weight="900"
          fill="none" 
          stroke="#ff3388" 
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round">비정형</text>

    <!-- 레이어 4: 그라데이션 (최상단, 얇은 선, 디테일) -->
    <text id="layer4" 
          x="600" y="420" 
          text-anchor="middle" 
          font-family="'Arial Black', 'Impact', sans-serif"
          font-size="180" 
          font-weight="900"
          fill="none" 
          stroke="url(#brushGradient)" 
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round">비정형</text>
  </g>
</svg>

<!-- 컨트롤 패널 -->
<div class="controls">
  <h3>비정형 브러시 타이포</h3>
  
  <label>텍스트</label>
  <input type="text" id="textInput" value="비정형" placeholder="텍스트 입력">
  
  <label>선 굵기 <input type="range" id="strokeWidth" min="1" max="20" value="8" step="0.5"><span class="val" id="strokeVal">8</span></label>
  
  <label>비정형 강도 <input type="range" id="displace" min="0" max="80" value="25" step="1"><span class="val" id="displaceVal">25</span></label>
  
  <label>노이즈 촘촘함 <input type="range" id="frequency" min="0.005" max="0.08" value="0.015" step="0.001"><span class="val" id="freqVal">0.015</span></label>
  
  <label>색수차 간격 <input type="range" id="chromatic" min="0" max="20" value="6" step="0.5"><span class="val" id="chromVal">6</span></label>
  
  <label>글자 크기 <input type="range" id="fontSize" min="60" max="400" value="180" step="5"><span class="val" id="sizeVal">180</span></label>
  
  <button id="randomBtn">🎲 패턴 바꾸기</button>
  <button id="modeBtn">🖌 유기적 모드</button>
  <button id="gradModeBtn">🌈 그라데이션 브러시</button>
  <button id="outlineModeBtn">✍️ 윤곽선 브러시</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
<script>
// ============================================
// DOM 요소 참조
// ============================================
const turbulence = document.getElementById('turbulence');
const displacement = document.getElementById('displacement');
const layers = [
  document.getElementById('layer1'),
  document.getElementById('layer2'),
  document.getElementById('layer3'),
  document.getElementById('layer4'),
];

const textInput = document.getElementById('textInput');
const strokeSlider = document.getElementById('strokeWidth');
const displaceSlider = document.getElementById('displace');
const freqSlider = document.getElementById('frequency');
const chromaticSlider = document.getElementById('chromatic');
const fontSizeSlider = document.getElementById('fontSize');
const randomBtn = document.getElementById('randomBtn');

// ============================================
// 업데이트 함수들
// ============================================

// 텍스트 변경
textInput.addEventListener('input', () => {
  const text = textInput.value || '비정형';
  layers.forEach(l => l.textContent = text);
});

// 선 굵기 변경
strokeSlider.addEventListener('input', () => {
  const val = Number(strokeSlider.value);
  document.getElementById('strokeVal').textContent = val;
  // 레이어별 비율 유지: 1번=val, 2번=val*0.6, 3번=val*0.6, 4번=val*0.25
  layers[0].setAttribute('stroke-width', val);
  layers[1].setAttribute('stroke-width', val * 0.6);
  layers[2].setAttribute('stroke-width', val * 0.6);
  layers[3].setAttribute('stroke-width', val * 0.25);
});

// 비정형 강도 (displacement scale)
displaceSlider.addEventListener('input', () => {
  const val = displaceSlider.value;
  document.getElementById('displaceVal').textContent = val;
  displacement.setAttribute('scale', val);
});

// 노이즈 촘촘함 (baseFrequency)
freqSlider.addEventListener('input', () => {
  const val = freqSlider.value;
  document.getElementById('freqVal').textContent = val;
  turbulence.setAttribute('baseFrequency', val);
});

// 색수차 간격 (레이어 offset)
chromaticSlider.addEventListener('input', () => {
  const val = Number(chromaticSlider.value);
  document.getElementById('chromVal').textContent = val;
  // 레이어 1: 왼쪽 위, 레이어 2: 오른쪽 아래
  layers[0].setAttribute('transform', `translate(${-val},${-val * 0.8})`);
  layers[1].setAttribute('transform', `translate(${val},${val * 0.8})`);
});

// 글자 크기
fontSizeSlider.addEventListener('input', () => {
  const val = fontSizeSlider.value;
  document.getElementById('sizeVal').textContent = val;
  layers.forEach(l => l.setAttribute('font-size', val));
});

// 패턴 바꾸기 (seed 랜덤)
randomBtn.addEventListener('click', () => {
  const newSeed = Math.floor(Math.random() * 1000);
  turbulence.setAttribute('seed', newSeed);
});

// ============================================
// 모드 2: 유기적 브러시 모드
// ============================================
const modeBtn = document.getElementById('modeBtn');
let isOrganicMode = false;

modeBtn.addEventListener('click', () => {
  isOrganicMode = !isOrganicMode;
  modeBtn.textContent = isOrganicMode ? '✏️ 기본 모드' : '🖌 유기적 모드';
  
  if (isOrganicMode) {
    // 유기적 모드: 두꺼운 선 + 강한 왜곡 + 큰 물결
    strokeSlider.value = 35;
    displaceSlider.value = 70;
    freqSlider.value = 0.01;
    chromaticSlider.value = 12;
    fontSizeSlider.value = 280;
    
    // 값 적용
    strokeSlider.dispatchEvent(new Event('input'));
    displaceSlider.dispatchEvent(new Event('input'));
    freqSlider.dispatchEvent(new Event('input'));
    chromaticSlider.dispatchEvent(new Event('input'));
    fontSizeSlider.dispatchEvent(new Event('input'));
    
    // 선 그리기 애니메이션 시작
    startDrawAnimation();
  } else {
    // 기본 모드 복원
    strokeSlider.value = 8;
    displaceSlider.value = 25;
    freqSlider.value = 0.015;
    chromaticSlider.value = 6;
    fontSizeSlider.value = 180;
    
    strokeSlider.dispatchEvent(new Event('input'));
    displaceSlider.dispatchEvent(new Event('input'));
    freqSlider.dispatchEvent(new Event('input'));
    chromaticSlider.dispatchEvent(new Event('input'));
    fontSizeSlider.dispatchEvent(new Event('input'));
    
    // 애니메이션 제거
    stopDrawAnimation();
  }
});

// ============================================
// 선 그리기 애니메이션 (stroke-dashoffset)
// ============================================
let animFrame = null;

function startDrawAnimation() {
  // 각 레이어의 총 경로 길이 추정 (텍스트 길이 기반)
  const pathLength = 3000;
  
  layers.forEach((layer, i) => {
    layer.style.strokeDasharray = pathLength;
    layer.style.strokeDashoffset = pathLength;
    layer.style.transition = 'none';
    
    // 각 레이어 시차를 두고 그려짐
    setTimeout(() => {
      layer.style.transition = `stroke-dashoffset 3s cubic-bezier(0.4, 0, 0.2, 1)`;
      layer.style.strokeDashoffset = '0';
    }, i * 400);
  });
  
  // 그려진 후 미세 흔들림 애니메이션
  setTimeout(() => {
    animateWobble();
  }, 3000);
}

function animateWobble() {
  let time = 0;
  
  function tick() {
    time += 0.02;
    // seed를 미세하게 변경해서 흔들림 효과
    const seed = 42 + Math.sin(time) * 2;
    turbulence.setAttribute('seed', Math.round(seed));
    animFrame = requestAnimationFrame(tick);
  }
  
  tick();
}

function stopDrawAnimation() {
  if (animFrame) {
    cancelAnimationFrame(animFrame);
    animFrame = null;
  }
  
  layers.forEach(layer => {
    layer.style.strokeDasharray = 'none';
    layer.style.strokeDashoffset = '0';
    layer.style.transition = 'none';
    layer.style.display = '';
  });
  
  // seed 복원
  turbulence.setAttribute('seed', '42');
}

// ============================================
// 모드 3: 그라데이션 브러시 모드
// ============================================
const gradModeBtn = document.getElementById('gradModeBtn');
let isGradMode = false;

gradModeBtn.addEventListener('click', () => {
  if (isOrganicMode) { isOrganicMode = false; modeBtn.textContent = '🖌 유기적 모드'; stopDrawAnimation(); }
  if (isOutlineMode) { isOutlineMode = false; outlineModeBtn.textContent = '✍️ 윤곽선 브러시'; const g = document.getElementById('outline-group'); if(g) g.remove(); layers.forEach(l => l.style.display = ''); stopDrawAnimation(); }
  
  isGradMode = !isGradMode;
  gradModeBtn.textContent = isGradMode ? '✏️ 기본 모드' : '🌈 그라데이션 브러시';
  
  if (isGradMode) {
    layers[0].style.display = 'none';
    layers[1].style.display = 'none';
    layers[2].style.display = 'none';
    layers[3].style.display = '';
    layers[3].setAttribute('stroke-width', '40');
    layers[3].setAttribute('stroke', 'url(#brushGradient)');
    displacement.setAttribute('scale', '60');
    turbulence.setAttribute('baseFrequency', '0.008');
    fontSizeSlider.value = 300;
    layers[3].setAttribute('font-size', '300');
    displaceSlider.value = 60; freqSlider.value = 0.008;
    document.getElementById('displaceVal').textContent = '60';
    document.getElementById('freqVal').textContent = '0.008';
    document.getElementById('sizeVal').textContent = '300';
    const pathLength = 4000;
    layers[3].style.strokeDasharray = pathLength;
    layers[3].style.strokeDashoffset = pathLength;
    layers[3].style.transition = 'none';
    setTimeout(() => { layers[3].style.transition = 'stroke-dashoffset 4s cubic-bezier(0.4, 0, 0.2, 1)'; layers[3].style.strokeDashoffset = '0'; }, 100);
    setTimeout(() => animateWobble(), 4000);
  } else {
    stopDrawAnimation();
    layers.forEach(l => l.style.display = '');
    layers[3].setAttribute('stroke-width', '2');
    strokeSlider.value = 8; displaceSlider.value = 25; freqSlider.value = 0.015; fontSizeSlider.value = 180;
    strokeSlider.dispatchEvent(new Event('input')); displaceSlider.dispatchEvent(new Event('input'));
    freqSlider.dispatchEvent(new Event('input')); fontSizeSlider.dispatchEvent(new Event('input'));
  }
});

// ============================================
// 모드 4: 윤곽선 브러시 모드 (opentype.js로 글리프 path 추출)
// ============================================
const outlineModeBtn = document.getElementById('outlineModeBtn');
let isOutlineMode = false;
let loadedFont = null;

// 한글 폰트 로드 (Noto Sans KR Bold)
opentype.load('https://cdn.jsdelivr.net/gh/nicholasgasior/gfonts-subset@master/fonts/noto-sans-kr/NotoSansKR-Bold.otf', (err, font) => {
  if (err) {
    console.warn('폰트 로드 실패, 대체 폰트 시도:', err);
    // 대체: 영문 폰트
    opentype.load('https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/fonts/FiraSansMedium.woff', (err2, font2) => {
      if (!err2) loadedFont = font2;
    });
  } else {
    loadedFont = font;
  }
});

outlineModeBtn.addEventListener('click', () => {
  // 다른 모드 끄기
  if (isOrganicMode) {
    isOrganicMode = false;
    modeBtn.textContent = '🖌 유기적 모드';
    stopDrawAnimation();
  }
  if (isGradMode) {
    isGradMode = false;
    gradModeBtn.textContent = '🌈 그라데이션 브러시';
    stopDrawAnimation();
    layers.forEach(l => l.style.display = '');
    layers[3].setAttribute('stroke-width', '2');
  }
  
  isOutlineMode = !isOutlineMode;
  outlineModeBtn.textContent = isOutlineMode ? '✏️ 기본 모드' : '✍️ 윤곽선 브러시';
  
  if (isOutlineMode) {
    // 기존 텍스트 레이어 숨기기
    layers.forEach(l => l.style.display = 'none');
    
    // 윤곽선 path 생성
    renderOutlineBrush(textInput.value || '비정형');
  } else {
    // 기본 모드 복원
    layers.forEach(l => l.style.display = '');
    
    // 윤곽선 path 제거
    const outlineGroup = document.getElementById('outline-group');
    if (outlineGroup) outlineGroup.remove();
    
    stopDrawAnimation();
    strokeSlider.value = 8;
    displaceSlider.value = 25;
    freqSlider.value = 0.015;
    fontSizeSlider.value = 180;
    strokeSlider.dispatchEvent(new Event('input'));
    displaceSlider.dispatchEvent(new Event('input'));
    freqSlider.dispatchEvent(new Event('input'));
    fontSizeSlider.dispatchEvent(new Event('input'));
  }
});

function renderOutlineBrush(text) {
  if (!loadedFont) {
    alert('폰트 로딩 중... 잠시 후 다시 시도해주세요.');
    return;
  }
  
  // 기존 윤곽선 그룹 제거
  const existing = document.getElementById('outline-group');
  if (existing) existing.remove();
  
  const svg = document.getElementById('svg');
  const svgNS = 'http://www.w3.org/2000/svg';
  
  // opentype.js로 글리프 path 추출
  const fontSize = 250;
  const path = loadedFont.getPath(text, 150, 500, fontSize);
  const pathData = path.toPathData(2); // SVG path d 문자열
  
  // 윤곽선 그룹 생성
  const group = document.createElementNS(svgNS, 'g');
  group.id = 'outline-group';
  group.setAttribute('filter', 'url(#brush-filter)');
  
  // 색상 레이어 3개 (색수차) + 그라데이션 1개
  const layerConfigs = [
    { stroke: '#0066ff', width: 5, dx: -5, dy: -4 },
    { stroke: '#00cc44', width: 3.5, dx: 5, dy: 4 },
    { stroke: '#ff88cc', width: 3, dx: 0, dy: 0 },
    { stroke: 'url(#brushGradient)', width: 1.5, dx: 0, dy: 0 },
  ];
  
  layerConfigs.forEach((cfg, i) => {
    const pathEl = document.createElementNS(svgNS, 'path');
    pathEl.setAttribute('d', pathData);
    pathEl.setAttribute('fill', 'none');
    pathEl.setAttribute('stroke', cfg.stroke);
    pathEl.setAttribute('stroke-width', cfg.width);
    pathEl.setAttribute('stroke-linecap', 'round');
    pathEl.setAttribute('stroke-linejoin', 'round');
    if (cfg.dx || cfg.dy) {
      pathEl.setAttribute('transform', `translate(${cfg.dx},${cfg.dy})`);
    }
    
    // 그리기 애니메이션
    const totalLength = pathEl.getTotalLength ? 5000 : 5000;
    pathEl.style.strokeDasharray = totalLength;
    pathEl.style.strokeDashoffset = totalLength;
    pathEl.style.transition = 'none';
    
    group.appendChild(pathEl);
    
    // 시차 애니메이션
    setTimeout(() => {
      pathEl.style.transition = `stroke-dashoffset 3s cubic-bezier(0.4, 0, 0.2, 1)`;
      pathEl.style.strokeDashoffset = '0';
    }, 100 + i * 300);
  });
  
  svg.appendChild(group);
  
  // 왜곡 강화
  displacement.setAttribute('scale', '40');
  turbulence.setAttribute('baseFrequency', '0.012');
  displaceSlider.value = 40;
  freqSlider.value = 0.012;
  document.getElementById('displaceVal').textContent = '40';
  document.getElementById('freqVal').textContent = '0.012';
  
  // 그려진 후 흔들림
  setTimeout(() => animateWobble(), 3500);
}

// 텍스트 변경 시 윤곽선 모드면 다시 그리기
textInput.addEventListener('input', () => {
  if (isOutlineMode) {
    renderOutlineBrush(textInput.value || '비정형');
  }
});
</script>
