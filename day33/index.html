<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비정형 브러시 타이포</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }

  svg {
    width: 100vw;
    height: 100vh;
    position: fixed;
    top: 0;
    left: 0;
  }

  /* 컨트롤 패널 */
  .controls {
    position: fixed;
    top: 16px;
    right: 16px;
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 11px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 200px;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .controls h3 {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    opacity: 0.5;
    margin-bottom: 4px;
  }
  .controls label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .controls input[type=range] { flex: 1; height: 4px; }
  .controls input[type=text] {
    width: 100%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 12px;
    outline: none;
  }
  .controls .val {
    font-variant-numeric: tabular-nums;
    min-width: 28px;
    text-align: right;
    opacity: 0.6;
  }
  .controls button {
    padding: 6px 12px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
  }
  .controls button:hover { background: rgba(255,255,255,0.25); }
  .controls button.active { background: rgba(255,255,255,0.35); border-color: rgba(255,255,255,0.6); }
  .controls .modes { display: flex; flex-wrap: wrap; gap: 4px; }
</style>
</head>
<body>

<canvas id="brushCanvas" style="position:fixed;top:0;left:0;width:100vw;height:100vh;display:none;z-index:5;"></canvas>

<!-- ============================================
  SVG 구조:
  1. <defs>에 feTurbulence + feDisplacementMap 필터 정의
  2. 4개 텍스트 레이어를 각각 다른 색/오프셋으로 겹침
  3. 결과: 색수차 + 비정형 브러시 효과
============================================ -->
<svg id="svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- 
      feTurbulence: Perlin noise 생성
      - type="turbulence": 더 거친 패턴 (fractalNoise보다 날카로움)
      - baseFrequency: 노이즈 촘촘함 (작을수록 큰 물결, 클수록 잔잔)
      - numOctaves: 디테일 레이어 수
      - seed: 패턴 시드 (바꾸면 완전히 다른 모양)
      
      feDisplacementMap: 노이즈를 이용해 이미지 왜곡
      - in: 왜곡할 대상 (SourceGraphic = 텍스트)
      - in2: 왜곡 맵 (위에서 만든 noise)
      - scale: 왜곡 강도 (클수록 더 구불구불)
      - xChannelSelector/yChannelSelector: R/G 채널로 X/Y축 왜곡
    -->
    <filter id="brush-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence 
        id="turbulence"
        type="turbulence" 
        baseFrequency="0.015" 
        numOctaves="3" 
        seed="42" 
        result="noise"/>
      <feDisplacementMap 
        id="displacement"
        in="SourceGraphic" 
        in2="noise" 
        scale="25" 
        xChannelSelector="R" 
        yChannelSelector="G"/>
    </filter>

    <!-- 그라데이션: 파랑 → 흰 → 초록 (세로 방향) -->
    <linearGradient id="brushGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0085ff"/>
      <stop offset="50%" stop-color="#fceeff"/>
      <stop offset="100%" stop-color="#39ff4a"/>
    </linearGradient>
  </defs>

  <!-- 
    레이어 구성 (뒤에서 앞으로):
    1. 파랑 레이어: 왼쪽 위로 offset → 색수차의 "파랑 채널"
    2. 초록 레이어: 오른쪽 아래로 offset → 색수차의 "초록 채널"
    3. 핑크/메인 레이어: 중앙 → 주 색상
    4. 그라데이션 레이어: 중앙, 얇은 선 → 디테일/하이라이트
  -->
  <g filter="url(#brush-filter)">
    <!-- 레이어 1: 파랑 (뒤쪽, 두꺼운 선, 왼쪽위 offset) -->
    <text id="layer1" 
          x="600" y="420" 
          text-anchor="middle" 
          font-family="'Arial Black', 'Impact', sans-serif"
          font-size="180" 
          font-weight="900"
          fill="none" 
          stroke="#0066ff" 
          stroke-width="8"
          stroke-linecap="round"
          stroke-linejoin="round"
          transform="translate(-6,-5)">비정형</text>

    <!-- 레이어 2: 초록 (중간, 중간 선, 오른쪽아래 offset) -->
    <text id="layer2" 
          x="600" y="420" 
          text-anchor="middle" 
          font-family="'Arial Black', 'Impact', sans-serif"
          font-size="180" 
          font-weight="900"
          fill="none" 
          stroke="#00cc44" 
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"
          transform="translate(6,5)">비정형</text>

    <!-- 레이어 3: 핑크/메인 (앞쪽, 중간 선, 중앙) -->
    <text id="layer3" 
          x="600" y="420" 
          text-anchor="middle" 
          font-family="'Arial Black', 'Impact', sans-serif"
          font-size="180" 
          font-weight="900"
          fill="none" 
          stroke="#ff3388" 
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round">비정형</text>

    <!-- 레이어 4: 그라데이션 (최상단, 얇은 선, 디테일) -->
    <text id="layer4" 
          x="600" y="420" 
          text-anchor="middle" 
          font-family="'Arial Black', 'Impact', sans-serif"
          font-size="180" 
          font-weight="900"
          fill="none" 
          stroke="url(#brushGradient)" 
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round">비정형</text>
  </g>
</svg>

<!-- 컨트롤 패널 -->
<div class="controls">
  <h3>비정형 브러시 타이포</h3>
  
  <label>텍스트</label>
  <input type="text" id="textInput" value="비정형" placeholder="텍스트 입력">
  
  <label data-modes="organic,gradient,canvasBrush">선 굵기 <input type="range" id="strokeWidth" min="1" max="20" value="8" step="0.5"><span class="val" id="strokeVal">8</span></label>
  
  <label data-modes="organic,gradient,outline">비정형 강도 <input type="range" id="displace" min="0" max="80" value="25" step="1"><span class="val" id="displaceVal">25</span></label>
  
  <label data-modes="organic,gradient,outline">노이즈 촘촘함 <input type="range" id="frequency" min="0.005" max="0.08" value="0.015" step="0.001"><span class="val" id="freqVal">0.015</span></label>
  
  <label data-modes="organic,canvasBrush">색수차 간격 <input type="range" id="chromatic" min="0" max="20" value="6" step="0.5"><span class="val" id="chromVal">6</span></label>
  
  <label data-modes="organic,gradient">글자 크기 <input type="range" id="fontSize" min="60" max="400" value="180" step="5"><span class="val" id="sizeVal">180</span></label>
  
  <label data-modes="canvasBrush">이탈강도 <input type="range" id="wander" min="0" max="5" value="1" step="0.1"><span class="val" id="wanderVal">1</span></label>
  <label data-modes="canvasBrush">관성 <input type="range" id="inertia" min="1" max="30" value="8" step="1"><span class="val" id="inertiaVal2">8</span></label>
  <label data-modes="canvasBrush">복귀력 <input type="range" id="pull" min="0.01" max="1" value="0.3" step="0.01"><span class="val" id="pullVal">0.3</span></label>
  
  <div class="modes">
    <button id="modeBtn" class="active">🖌 유기적</button>
    <button id="gradModeBtn">🌈 그라데이션</button>
    <button id="outlineModeBtn">✍️ 윤곽선</button>
    <button id="canvasBrushBtn">🖊 브러시</button>
  </div>
  <button id="randomBtn">🎲 패턴 바꾸기</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
<script>
// ============================================
// DOM 요소 참조
// ============================================
const turbulence = document.getElementById('turbulence');
const displacement = document.getElementById('displacement');
const layers = [
  document.getElementById('layer1'),
  document.getElementById('layer2'),
  document.getElementById('layer3'),
  document.getElementById('layer4'),
];

const textInput = document.getElementById('textInput');
const strokeSlider = document.getElementById('strokeWidth');
const displaceSlider = document.getElementById('displace');
const freqSlider = document.getElementById('frequency');
const chromaticSlider = document.getElementById('chromatic');
const fontSizeSlider = document.getElementById('fontSize');
const randomBtn = document.getElementById('randomBtn');

// ============================================
// 업데이트 함수들
// ============================================

// 텍스트 변경
textInput.addEventListener('input', () => {
  const text = textInput.value || '비정형';
  layers.forEach(l => l.textContent = text);
});

// 선 굵기 변경
strokeSlider.addEventListener('input', () => {
  const val = Number(strokeSlider.value);
  document.getElementById('strokeVal').textContent = val;
  // 레이어별 비율 유지: 1번=val, 2번=val*0.6, 3번=val*0.6, 4번=val*0.25
  layers[0].setAttribute('stroke-width', val);
  layers[1].setAttribute('stroke-width', val * 0.6);
  layers[2].setAttribute('stroke-width', val * 0.6);
  layers[3].setAttribute('stroke-width', val * 0.25);
});

// 비정형 강도 (displacement scale)
displaceSlider.addEventListener('input', () => {
  const val = displaceSlider.value;
  document.getElementById('displaceVal').textContent = val;
  displacement.setAttribute('scale', val);
});

// 노이즈 촘촘함 (baseFrequency)
freqSlider.addEventListener('input', () => {
  const val = freqSlider.value;
  document.getElementById('freqVal').textContent = val;
  turbulence.setAttribute('baseFrequency', val);
});

// 색수차 간격 (레이어 offset)
chromaticSlider.addEventListener('input', () => {
  const val = Number(chromaticSlider.value);
  document.getElementById('chromVal').textContent = val;
  // 레이어 1: 왼쪽 위, 레이어 2: 오른쪽 아래
  layers[0].setAttribute('transform', `translate(${-val},${-val * 0.8})`);
  layers[1].setAttribute('transform', `translate(${val},${val * 0.8})`);
});

// 글자 크기
fontSizeSlider.addEventListener('input', () => {
  const val = fontSizeSlider.value;
  document.getElementById('sizeVal').textContent = val;
  layers.forEach(l => l.setAttribute('font-size', val));
});

// 패턴 바꾸기 (seed 랜덤)
randomBtn.addEventListener('click', () => {
  const newSeed = Math.floor(Math.random() * 1000);
  turbulence.setAttribute('seed', newSeed);
});

// ============================================
// 모드 전환 (라디오 방식 - 하나만 활성)
// ============================================
const modeButtons = document.querySelectorAll('.modes button');
let currentMode = 'organic';
let animFrame = null; // 여기서 선언해야 switchMode에서 접근 가능

function switchMode(mode) {
  // 이전 모드 정리
  stopDrawAnimation();
  const _brushCanvas = document.getElementById('brushCanvas');
  _brushCanvas.style.display = 'none';
  document.getElementById('svg').style.display = '';
  layers.forEach(l => { l.style.display = ''; });
  const outlineG = document.getElementById('outline-group');
  if (outlineG) outlineG.remove();
  layers[3].setAttribute('stroke-width', '2');
  layers[3].setAttribute('stroke', 'url(#brushGradient)');
  
  // 버튼 활성 표시
  modeButtons.forEach(b => b.classList.remove('active'));
  document.getElementById(
    mode === 'organic' ? 'modeBtn' :
    mode === 'gradient' ? 'gradModeBtn' :
    mode === 'outline' ? 'outlineModeBtn' : 'canvasBrushBtn'
  ).classList.add('active');
  
  currentMode = mode;
  
  // 슬라이더 표시/숨김
  document.querySelectorAll('.controls label[data-modes]').forEach(label => {
    const modes = label.dataset.modes.split(',');
    label.style.display = modes.includes(mode) ? '' : 'none';
  });
  
  // 새 모드 적용
  if (mode === 'default') {
    strokeSlider.value = 8; displaceSlider.value = 25; freqSlider.value = 0.015; fontSizeSlider.value = 180;
    strokeSlider.dispatchEvent(new Event('input')); displaceSlider.dispatchEvent(new Event('input'));
    freqSlider.dispatchEvent(new Event('input')); fontSizeSlider.dispatchEvent(new Event('input'));
  }
  else if (mode === 'organic') {
    strokeSlider.value = 35; displaceSlider.value = 70; freqSlider.value = 0.01; chromaticSlider.value = 12; fontSizeSlider.value = 280;
    strokeSlider.dispatchEvent(new Event('input')); displaceSlider.dispatchEvent(new Event('input'));
    freqSlider.dispatchEvent(new Event('input')); chromaticSlider.dispatchEvent(new Event('input')); fontSizeSlider.dispatchEvent(new Event('input'));
    startDrawAnimation();
  }
  else if (mode === 'gradient') {
    layers[0].style.display = 'none'; layers[1].style.display = 'none'; layers[2].style.display = 'none';
    layers[3].setAttribute('stroke-width', '40');
    displacement.setAttribute('scale', '60'); turbulence.setAttribute('baseFrequency', '0.008');
    fontSizeSlider.value = 300; layers[3].setAttribute('font-size', '300');
    const pathLength = 4000;
    layers[3].style.strokeDasharray = pathLength;
    layers[3].style.strokeDashoffset = pathLength;
    layers[3].style.transition = 'none';
    setTimeout(() => { layers[3].style.transition = 'stroke-dashoffset 4s cubic-bezier(0.4, 0, 0.2, 1)'; layers[3].style.strokeDashoffset = '0'; }, 100);
    setTimeout(() => animateWobble(), 4000);
  }
  else if (mode === 'outline') {
    layers.forEach(l => l.style.display = 'none');
    renderOutlineBrush(textInput.value || '비정형');
  }
  else if (mode === 'canvasBrush') {
    document.getElementById('svg').style.display = 'none';
    document.getElementById('brushCanvas').style.display = 'block';
    const bc = document.getElementById('brushCanvas');
    bc.width = window.innerWidth;
    bc.height = window.innerHeight;
    renderCanvasBrush();
  }
}

// 버튼 이벤트 (기본 모드 버튼 없음 - 첫 모드가 기본)
document.getElementById('modeBtn').addEventListener('click', () => switchMode('organic'));
document.getElementById('gradModeBtn').addEventListener('click', () => switchMode('gradient'));
document.getElementById('outlineModeBtn').addEventListener('click', () => switchMode('outline'));
document.getElementById('canvasBrushBtn').addEventListener('click', () => switchMode('canvasBrush'));

// 초기 모드 적용
switchMode('organic');

// ============================================
// 선 그리기 애니메이션 (stroke-dashoffset)
// ============================================
function startDrawAnimation() {
  // 각 레이어의 총 경로 길이 추정 (텍스트 길이 기반)
  const pathLength = 3000;
  
  layers.forEach((layer, i) => {
    layer.style.strokeDasharray = pathLength;
    layer.style.strokeDashoffset = pathLength;
    layer.style.transition = 'none';
    
    // 각 레이어 시차를 두고 그려짐
    setTimeout(() => {
      layer.style.transition = `stroke-dashoffset 3s cubic-bezier(0.4, 0, 0.2, 1)`;
      layer.style.strokeDashoffset = '0';
    }, i * 400);
  });
  
  // 그려진 후 미세 흔들림 애니메이션
  setTimeout(() => {
    animateWobble();
  }, 3000);
}

function animateWobble() {
  let time = 0;
  
  function tick() {
    time += 0.02;
    // seed를 미세하게 변경해서 흔들림 효과
    const seed = 42 + Math.sin(time) * 2;
    turbulence.setAttribute('seed', Math.round(seed));
    animFrame = requestAnimationFrame(tick);
  }
  
  tick();
}

function stopDrawAnimation() {
  if (animFrame) {
    cancelAnimationFrame(animFrame);
    animFrame = null;
  }
  
  layers.forEach(layer => {
    layer.style.strokeDasharray = 'none';
    layer.style.strokeDashoffset = '0';
    layer.style.transition = 'none';
    layer.style.display = '';
  });
  
  // seed 복원
  turbulence.setAttribute('seed', '42');
}

// ============================================
// 모드 3~5는 switchMode()에서 처리됨
// ============================================

// ============================================
// 모드 4: 윤곽선 브러시 모드 (opentype.js로 글리프 path 추출)
// ============================================
const outlineModeBtn = document.getElementById('outlineModeBtn');
let loadedFont = null;

// 한글 폰트 로드 (Black Han Sans - 확실히 작동하는 ttf)
const FONT_URL = 'https://cdn.jsdelivr.net/gh/nicholasgasior/gfonts@master/fonts/black-han-sans/BlackHanSans-Regular.ttf';

fetch(FONT_URL)
  .then(res => res.arrayBuffer())
  .then(buffer => {
    loadedFont = opentype.parse(buffer);
    console.log('폰트 로드 완료');
  })
  .catch(err => {
    console.warn('폰트 로드 실패, Canvas 방식으로 대체:', err);
    // Canvas 기반 윤곽선 추출로 대체
    loadedFont = 'canvas-fallback';
  });

function renderOutlineBrush(text) {
  // 기존 윤곽선 그룹 제거
  const existing = document.getElementById('outline-group');
  if (existing) existing.remove();
  
  const svg = document.getElementById('svg');
  const svgNS = 'http://www.w3.org/2000/svg';
  
  let pathData;
  
  if (loadedFont && loadedFont !== 'canvas-fallback') {
    // opentype.js로 글리프 path 추출
    const fontSize = 250;
    const path = loadedFont.getPath(text, 150, 500, fontSize);
    pathData = path.toPathData(2);
  } else {
    // Canvas 기반 대체: 텍스트를 Canvas에 그려서 윤곽선 추출
    pathData = getCanvasOutlinePath(text);
  }
  
  if (!pathData) {
    console.error('path 생성 실패');
    return;
  }
  
  // 윤곽선 그룹 생성
  const group = document.createElementNS(svgNS, 'g');
  group.id = 'outline-group';
  group.setAttribute('filter', 'url(#brush-filter)');
  
  // 색상 레이어 2개 (색수차 줄임)
  const layerConfigs = [
    { stroke: '#0066ff', width: 4, dx: -3, dy: -2 },
    { stroke: 'url(#brushGradient)', width: 2.5, dx: 0, dy: 0 },
  ];
  
  layerConfigs.forEach((cfg, i) => {
    const pathEl = document.createElementNS(svgNS, 'path');
    pathEl.setAttribute('d', pathData);
    pathEl.setAttribute('fill', 'none');
    pathEl.setAttribute('stroke', cfg.stroke);
    pathEl.setAttribute('stroke-width', cfg.width);
    pathEl.setAttribute('stroke-linecap', 'round');
    pathEl.setAttribute('stroke-linejoin', 'round');
    if (cfg.dx || cfg.dy) {
      pathEl.setAttribute('transform', `translate(${cfg.dx},${cfg.dy})`);
    }
    
    // 그리기 애니메이션
    const totalLength = pathEl.getTotalLength ? 5000 : 5000;
    pathEl.style.strokeDasharray = totalLength;
    pathEl.style.strokeDashoffset = totalLength;
    pathEl.style.transition = 'none';
    
    group.appendChild(pathEl);
    
    // 시차 애니메이션
    setTimeout(() => {
      pathEl.style.transition = `stroke-dashoffset 3s cubic-bezier(0.4, 0, 0.2, 1)`;
      pathEl.style.strokeDashoffset = '0';
    }, 100 + i * 300);
  });
  
  svg.appendChild(group);
  
  // 왜곡 강화
  displacement.setAttribute('scale', '40');
  turbulence.setAttribute('baseFrequency', '0.012');
  displaceSlider.value = 40;
  freqSlider.value = 0.012;
  document.getElementById('displaceVal').textContent = '40';
  document.getElementById('freqVal').textContent = '0.012';
  
  // 그려진 후 흔들림
  setTimeout(() => animateWobble(), 3500);
}

// 텍스트 변경 시 윤곽선 모드면 다시 그리기
textInput.addEventListener('input', () => {
  if (currentMode === 'outline') {
    renderOutlineBrush(textInput.value || '비정형');
  }
  if (currentMode === 'canvasBrush') {
    renderCanvasBrush();
  }
});

// ============================================
// 모드 5: 브러시 윤곽선 (Canvas 2D contour tracing)
// ============================================
const canvasBrushBtn = document.getElementById('canvasBrushBtn');
const brushCanvas = document.getElementById('brushCanvas');
const bCtx = brushCanvas.getContext('2d');
let brushNoiseSeed = 0;

function renderCanvasBrush() {
  const W = brushCanvas.width;
  const H = brushCanvas.height;
  const text = textInput.value || '비정형';
  const lw = Number(document.getElementById('strokeWidth').value);
  const chromOffset = Number(document.getElementById('chromatic').value);
  const blurAmount = 0;
  const wanderStr = Number(document.getElementById('wander').value);
  const inertiaVal = Number(document.getElementById('inertia').value);
  const pullStr = Number(document.getElementById('pull').value);
  const step = 1;
  
  // 윤곽선 추출 (가이드 경로)
  const contours = extractBrushContours(text, W, H, step);
  
  // 배경
  bCtx.fillStyle = '#0a0a0a';
  bCtx.fillRect(0, 0, W, H);
  
  // 오프스크린 캔버스 (블러용)
  const offCanvas = document.createElement('canvas');
  offCanvas.width = W;
  offCanvas.height = H;
  const offCtx = offCanvas.getContext('2d');
  offCtx.clearRect(0, 0, W, H);
  
  // 색수차 레이어
  const layersCfg = [
    { dx: -chromOffset, dy: -chromOffset * 0.8, alpha: 0.7 },
    { dx: chromOffset, dy: chromOffset * 0.8, alpha: 0.7 },
    { dx: 0, dy: 0, alpha: 0.9 },
  ];
  
  layersCfg.forEach(layer => {
    offCtx.save();
    offCtx.translate(layer.dx, layer.dy);
    offCtx.globalAlpha = layer.alpha;
    
    contours.forEach(contour => {
      drawAgentContour(offCtx, contour, lw, wanderStr, inertiaVal, pullStr);
    });
    
    offCtx.restore();
  });
  
  // 블러 적용 후 메인 캔버스에 그리기
  if (blurAmount > 0) {
    bCtx.filter = `blur(${blurAmount}px)`;
  } else {
    bCtx.filter = 'none';
  }
  bCtx.drawImage(offCanvas, 0, 0);
  bCtx.filter = 'none';
}

// ============================================
// 에이전트 기반 윤곽선 그리기
// ============================================
function drawAgentContour(ctx, contour, baseWidth, wanderStr, inertiaVal, pullStr) {
  if (contour.length < 3) return;
  
  // 전체 패스 길이 계산
  let totalLength = 0;
  const lengths = [0];
  for (let i = 1; i < contour.length; i++) {
    const dx = contour[i][0] - contour[i-1][0];
    const dy = contour[i][1] - contour[i-1][1];
    totalLength += Math.sqrt(dx * dx + dy * dy);
    lengths.push(totalLength);
  }
  if (totalLength === 0) return;
  
  // 에이전트 초기화
  let ax = contour[0][0]; // 에이전트 위치
  let ay = contour[0][1];
  let vx = 0; // 에이전트 속도
  let vy = 0;
  
  const trail = [{ x: ax, y: ay }]; // 에이전트 궤적
  
  // 에이전트가 가이드 경로를 따라감
  for (let i = 1; i < contour.length; i++) {
    const [targetX, targetY] = contour[i];
    
    // 복귀력: 목표점으로 당기는 힘
    const pullX = (targetX - ax) * pullStr;
    const pullY = (targetY - ay) * pullStr;
    
    // 이탈강도: Fractal Noise 기반 랜덤 힘
    const noiseAngle = brushNoise(i * 0.5, ax * 0.01) * Math.PI * 2;
    const wanderX = Math.cos(noiseAngle) * wanderStr;
    const wanderY = Math.sin(noiseAngle) * wanderStr;
    
    // 관성 적용: 속도 감쇠 + 새 힘
    const decay = 1 - 1 / inertiaVal;
    vx = vx * decay + (pullX + wanderX) / inertiaVal;
    vy = vy * decay + (pullY + wanderY) / inertiaVal;
    
    // 위치 업데이트
    ax += vx;
    ay += vy;
    
    trail.push({ x: ax, y: ay });
  }
  
  // 궤적을 누적 거리 기반 색상으로 그리기
  let trailLength = 0;
  const trailLengths = [0];
  for (let i = 1; i < trail.length; i++) {
    const dx = trail[i].x - trail[i-1].x;
    const dy = trail[i].y - trail[i-1].y;
    trailLength += Math.sqrt(dx * dx + dy * dy);
    trailLengths.push(trailLength);
  }
  
  for (let i = 1; i < trail.length; i++) {
    const t = trailLengths[i] / trailLength;
    const color = interpolateColor(t);
    
    // lineWidth 변동
    const lw = baseWidth + brushNoise(i * 0.2, 0) * (baseWidth * 0.4);
    
    ctx.beginPath();
    ctx.moveTo(trail[i-1].x, trail[i-1].y);
    ctx.lineTo(trail[i].x, trail[i].y);
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(0.5, lw);
    ctx.lineCap = 'round';
    ctx.stroke();
  }
}

function extractBrushContours(text, W, H, step) {
  const tmpCanvas = document.createElement('canvas');
  tmpCanvas.width = W;
  tmpCanvas.height = H;
  const tmpCtx = tmpCanvas.getContext('2d');
  
  tmpCtx.clearRect(0, 0, W, H);
  tmpCtx.fillStyle = '#000';
  tmpCtx.font = `900 ${Math.min(W * 0.22, 280)}px "Arial Black", Impact, sans-serif`;
  tmpCtx.textAlign = 'center';
  tmpCtx.textBaseline = 'middle';
  tmpCtx.fillText(text, W / 2, H / 2);
  
  const imageData = tmpCtx.getImageData(0, 0, W, H);
  const data = imageData.data;
  
  function isInside(x, y) {
    if (x < 0 || x >= W || y < 0 || y >= H) return false;
    return data[(y * W + x) * 4 + 3] > 128;
  }
  
  // 경계 픽셀: 안쪽이면서 상하좌우 중 바깥이 있음
  function isBorder(x, y) {
    if (!isInside(x, y)) return false;
    return !isInside(x-1, y) || !isInside(x+1, y) || 
           !isInside(x, y-1) || !isInside(x, y+1);
  }
  
  // 경계 픽셀을 step 간격으로 수집
  const borderSet = new Set();
  const borderList = [];
  
  for (let y = 0; y < H; y += step) {
    for (let x = 0; x < W; x += step) {
      if (isBorder(x, y)) {
        const key = `${x},${y}`;
        borderSet.add(key);
        borderList.push([x, y]);
      }
    }
  }
  
  // 8방향 이웃 추적으로 연결된 윤곽선 추출
  const contours = [];
  const visited = new Set();
  const dirs = [[step,0],[step,step],[0,step],[-step,step],[-step,0],[-step,-step],[0,-step],[step,-step]];
  
  for (const [sx, sy] of borderList) {
    const startKey = `${sx},${sy}`;
    if (visited.has(startKey)) continue;
    
    const contour = [];
    let cx = sx, cy = sy;
    let prevDir = 0; // 이전 방향 기억 (같은 방향 우선)
    
    for (let iter = 0; iter < 20000; iter++) {
      const key = `${cx},${cy}`;
      if (visited.has(key) && contour.length > 4) break;
      
      visited.add(key);
      contour.push([cx, cy]);
      
      // 다음 이웃 찾기 (이전 방향부터 시계방향으로 탐색)
      let found = false;
      for (let d = 0; d < 8; d++) {
        const di = (prevDir + d) % 8;
        const [dx, dy] = dirs[di];
        const nx = cx + dx;
        const ny = cy + dy;
        const nKey = `${nx},${ny}`;
        
        if (borderSet.has(nKey) && !visited.has(nKey)) {
          cx = nx;
          cy = ny;
          prevDir = (di + 6) % 8; // 다음 탐색 시작 방향 (반시계 2칸)
          found = true;
          break;
        }
      }
      
      if (!found) break;
    }
    
    // 짧은 윤곽선 필터 + 직선 필터
    if (contour.length > 15) {
      // 직선 비율 체크: 시작점~끝점 직선거리 vs 실제 경로 길이
      const startEnd = Math.sqrt(
        (contour[0][0] - contour[contour.length-1][0])**2 + 
        (contour[0][1] - contour[contour.length-1][1])**2
      );
      let pathLen = 0;
      for (let i = 1; i < contour.length; i++) {
        pathLen += Math.sqrt(
          (contour[i][0] - contour[i-1][0])**2 + 
          (contour[i][1] - contour[i-1][1])**2
        );
      }
      // 직선 비율이 0.95 이상이면 (거의 완전 직선) 스킵
      const straightRatio = startEnd / Math.max(pathLen, 1);
      if (straightRatio < 0.95) {
        contours.push(contour);
      }
    }
  }
  
  return contours;
}

function brushNoise(x, y) {
  const n = Math.sin(x * 12.9898 + y * 78.233 + brushNoiseSeed * 43.12) * 43758.5453;
  return (n - Math.floor(n)) * 2 - 1;
}

function drawBrushContour(contour, baseWidth, noiseStr) {
  // STEP 2: 전체 패스 길이 계산
  let totalLength = 0;
  const lengths = [0];
  
  for (let i = 1; i < contour.length; i++) {
    const dx = contour[i][0] - contour[i-1][0];
    const dy = contour[i][1] - contour[i-1][1];
    totalLength += Math.sqrt(dx * dx + dy * dy);
    lengths.push(totalLength);
  }
  
  if (totalLength === 0) return;
  
  // STEP 3: 누적 거리 비율(t)로 색상 결정하며 선분 그리기
  for (let i = 1; i < contour.length; i++) {
    const [x1, y1] = contour[i - 1];
    const [x2, y2] = contour[i];
    
    const segLen = Math.sqrt((x2-x1)**2 + (y2-y1)**2);
    if (segLen < 0.5) continue;
    
    // 노이즈 떨림
    const nx1 = x1 + brushNoise(x1*0.1, y1*0.1) * noiseStr;
    const ny1 = y1 + brushNoise(x1*0.1+100, y1*0.1) * noiseStr;
    const nx2 = x2 + brushNoise(x2*0.1, y2*0.1) * noiseStr;
    const ny2 = y2 + brushNoise(x2*0.1+100, y2*0.1) * noiseStr;
    
    // 누적 거리 비율 (0 ~ 1)
    const t = lengths[i] / totalLength;
    
    // t값으로 파랑→흰→초록 보간
    const color = interpolateColor(t);
    
    // lineWidth 변동
    const lw = baseWidth + brushNoise(i * 0.3, 0) * (baseWidth * 0.4);
    
    // 선분 그리기 (blob X, 실제 선으로)
    bCtx.beginPath();
    bCtx.moveTo(nx1, ny1);
    bCtx.lineTo(nx2, ny2);
    bCtx.strokeStyle = color;
    bCtx.lineWidth = Math.max(0.5, lw);
    bCtx.lineCap = 'round';
    bCtx.stroke();
  }
}

// 색상 보간: t=0 파랑, t=0.5 흰, t=1 초록
function interpolateColor(t) {
  const colors = [
    { r: 0, g: 133, b: 255 },    // #0085ff (파랑)
    { r: 252, g: 238, b: 255 },  // #fceeff (흰/핑크)
    { r: 57, g: 255, b: 74 },    // #39ff4a (초록)
  ];
  
  // t를 0~2 범위로 매핑 (3색 사이 보간)
  const scaled = t * (colors.length - 1);
  const idx = Math.min(Math.floor(scaled), colors.length - 2);
  const frac = scaled - idx;
  
  const c1 = colors[idx];
  const c2 = colors[idx + 1];
  
  const r = Math.round(c1.r + (c2.r - c1.r) * frac);
  const g = Math.round(c1.g + (c2.g - c1.g) * frac);
  const b = Math.round(c1.b + (c2.b - c1.b) * frac);
  
  return `rgb(${r},${g},${b})`;
}

// 패턴 바꾸기에 Canvas 모드도 연동
randomBtn.addEventListener('click', () => {
  if (currentMode === 'canvasBrush') {
    brushNoiseSeed = Math.random() * 1000;
    renderCanvasBrush();
  }
});

// 슬라이더 변경 시 Canvas 모드면 다시 그리기
document.querySelectorAll('.controls input[type=range]').forEach(slider => {
  slider.addEventListener('input', () => {
    const valEl = slider.nextElementSibling;
    if (valEl && valEl.classList.contains('val')) valEl.textContent = slider.value;
    if (currentMode === 'canvasBrush') renderCanvasBrush();
  });
});

window.addEventListener('resize', () => {
  if (currentMode === 'canvasBrush') {
    brushCanvas.width = window.innerWidth;
    brushCanvas.height = window.innerHeight;
    renderCanvasBrush();
  }
});

// ============================================
// Canvas 기반 윤곽선 추출 (폰트 로드 실패 시 대체)
// ============================================
function getCanvasOutlinePath(text) {
  const canvas = document.createElement('canvas');
  const W = 1200, H = 800;
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000';
  ctx.font = 'bold 250px "Arial Black", Impact, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, W/2, H/2);
  
  // Contour Tracing으로 윤곽선 추출
  const imageData = ctx.getImageData(0, 0, W, H);
  const data = imageData.data;
  const step = 3;
  
  function isInside(x, y) {
    if (x < 0 || x >= W || y < 0 || y >= H) return false;
    return data[(y * W + x) * 4 + 3] > 128;
  }
  
  function isBorder(x, y) {
    if (!isInside(x, y)) return false;
    return !isInside(x-1, y) || !isInside(x+1, y) || !isInside(x, y-1) || !isInside(x, y+1);
  }
  
  // 경계 픽셀 수집
  const borderSet = new Set();
  const borderList = [];
  for (let y = 0; y < H; y += step) {
    for (let x = 0; x < W; x += step) {
      if (isBorder(x, y)) {
        borderSet.add(`${x},${y}`);
        borderList.push([x, y]);
      }
    }
  }
  
  // 8방향 이웃 추적
  const visited = new Set();
  const dirs = [[step,0],[step,step],[0,step],[-step,step],[-step,0],[-step,-step],[0,-step],[step,-step]];
  let pathStr = '';
  
  for (const [sx, sy] of borderList) {
    if (visited.has(`${sx},${sy}`)) continue;
    
    const contour = [];
    let cx = sx, cy = sy;
    let prevDir = 0;
    
    for (let iter = 0; iter < 20000; iter++) {
      const key = `${cx},${cy}`;
      if (visited.has(key) && contour.length > 4) break;
      visited.add(key);
      contour.push([cx, cy]);
      
      let found = false;
      for (let d = 0; d < 8; d++) {
        const di = (prevDir + d) % 8;
        const [dx, dy] = dirs[di];
        const nKey = `${cx+dx},${cy+dy}`;
        if (borderSet.has(nKey) && !visited.has(nKey)) {
          cx += dx; cy += dy;
          prevDir = (di + 6) % 8;
          found = true;
          break;
        }
      }
      if (!found) break;
    }
    
    // 최소 길이 필터
    if (contour.length > 20) {
      pathStr += ' M ' + contour.map(p => `${p[0]} ${p[1]}`).join(' L ');
      pathStr += ' Z'; // 닫기
    }
  }
  
  return pathStr || null;
}
