<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Metaball Typography Poster</title>
<style>
html, body {
  margin: 0; 
  padding: 0;
  background: #000;
  overflow: hidden;
  height: 100%;
  width: 100%;
  position: fixed;
  font-family: -apple-system, sans-serif;
}
* {
  box-sizing: border-box;
}
*:focus {
  outline: none;
}
canvas {
  display: block;
  cursor: crosshair;
  position: fixed;
  top: 0;
  left: 0;
  outline: none;
}
canvas:focus {
  outline: none;
}
.hint {
  position: fixed;
  top: 16px; 
  left: 20px;
  color: rgba(255,255,255,0.4);
  font-size: 12px;
  letter-spacing: 0.05em;
  pointer-events: none;
  z-index: 10;
}
.word {
  position: fixed;
  bottom: 16px; 
  right: 20px;
  color: rgba(255,255,255,0.35);
  font-size: 11px;
  letter-spacing: 0.1em;
  pointer-events: none;
  z-index: 10;
  background: transparent;
}
</style>
</head>
<body>
<div class="hint">TYPE TO CHANGE TEXT · BACKSPACE TO DELETE · CLICK TO CYCLE PRESETS</div>
<div class="word" id="word-label">MOLD</div>
<canvas id="c"></canvas>

<script>
(function(){
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const label = document.getElementById('word-label');

let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

window.addEventListener('resize', () => {
  resize();
  setupBlobs(isTyping ? customText : words[wordIdx]);
});

resize();

const words = ['MOLD', '2026'];
let wordIdx = 0;
let blobs = [];
const mouse = { x: -9999, y: -9999, isOver: false };
let customText = '';
let isTyping = false;
let spreadingBlobs = []; // 번지는 효과용 임시 blob들

// ===== Step 1: 글자에서 anchor 좌표 추출 =====
function extractAnchors(text) {
  const tmp = document.createElement('canvas');
  tmp.width = W;
  tmp.height = H;
  const tctx = tmp.getContext('2d');
  
  tctx.fillStyle = '#000';
  tctx.fillRect(0, 0, W, H);
  tctx.fillStyle = '#fff';
  
  // 폰트 크기: 화면 높이의 35%
  const fontSize = Math.floor(H * 0.35);
  tctx.font = 'bold ' + fontSize + 'px sans-serif';
  tctx.textAlign = 'center';
  tctx.textBaseline = 'middle';
  tctx.fillText(text, W / 2, H / 2);
  
  const img = tctx.getImageData(0, 0, W, H).data;
  const anchors = [];
  const step = 15; // 10 → 15 (속도 개선)
  
  for (let y = 0; y < H; y += step) {
    for (let x = 0; x < W; x += step) {
      const i = (y * W + x) * 4;
      // 흰색 픽셀이면 anchor로 채택
      if (img[i] > 128) {
        anchors.push({
          x: x + (Math.random() - 0.5) * 2,
          y: y + (Math.random() - 0.5) * 2
        });
      }
    }
  }
  
  return anchors;
}

// ===== Step 2: blob 생성 =====
function setupBlobs(text) {
  const anchors = extractAnchors(text);
  blobs = anchors.map(a => {
    // 크기 다양화 (일부는 크고 일부는 작게)
    const sizeVariation = Math.random();
    let radius;
    if (sizeVariation < 0.1) {
      radius = 15 + Math.random() * 5; // 10% 큰 blob
    } else if (sizeVariation < 0.3) {
      radius = 6 + Math.random() * 3; // 20% 작은 blob
    } else {
      radius = 9 + Math.random() * 2.5; // 70% 보통
    }
    
    // anchor 위치에 랜덤 오프셋 (글자 형태 왜곡)
    const anchorOffsetX = (Math.random() - 0.5) * 20;
    const anchorOffsetY = (Math.random() - 0.5) * 20;
    
    return {
      anchorX: a.x + anchorOffsetX,
      anchorY: a.y + anchorOffsetY,
      x: a.x + (Math.random() - 0.5) * 80,
      y: a.y + (Math.random() - 0.5) * 80,
      vx: 0, 
      vy: 0,
      radius: radius,
      phase: Math.random() * Math.PI * 2,
      radiusPhase: Math.random() * Math.PI * 2,
      flickerPhase: Math.random() * Math.PI * 2,
      thresholdOffset: (Math.random() - 0.5) * 0.2,
      // 부패 효과용
      lifespan: 0.5 + Math.random() * 0.5, // 0.5~1.0 (생명력)
      decaySpeed: 0.001 + Math.random() * 0.002, // 죽는 속도
      isDying: Math.random() < 0.1 // 10%는 처음부터 죽어가는 중
    };
  });
  
  label.textContent = text;
  console.log('blob count:', blobs.length);
  
  // 임시 캔버스 정리 (메모리 누수 방지)
  if (window.tempCanvas) {
    window.tempCanvas = null;
  }
}

setupBlobs(words[0]);

// ===== 이벤트 =====
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.isOver = true;
  
  // 마우스 주변에서 번지는 효과 (확률적으로 새 blob 생성)
  if (Math.random() < 0.15) { // 15% 확률
    const angle = Math.random() * Math.PI * 2;
    const distance = 30 + Math.random() * 50;
    
    spreadingBlobs.push({
      x: mouse.x + Math.cos(angle) * distance,
      y: mouse.y + Math.sin(angle) * distance,
      vx: Math.cos(angle) * 2,
      vy: Math.sin(angle) * 2,
      radius: 4 + Math.random() * 6,
      life: 1.0, // 생명력 (1.0 → 0)
      phase: Math.random() * Math.PI * 2,
      radiusPhase: Math.random() * Math.PI * 2,
      flickerPhase: Math.random() * Math.PI * 2,
      thresholdOffset: (Math.random() - 0.5) * 0.2
    });
  }
});

window.addEventListener('mouseleave', () => {
  mouse.x = -9999; 
  mouse.y = -9999;
  mouse.isOver = false;
});

window.addEventListener('click', () => {
  // 타이핑 모드 해제하고 프리셋으로 전환
  isTyping = false;
  customText = '';
  
  wordIdx = (wordIdx + 1) % words.length;
  
  // anchor만 갱신하면 부드럽게 변형
  const newAnchors = extractAnchors(words[wordIdx]);
  
  // blob 개수 맞추기
  if (newAnchors.length > blobs.length) {
    // 부족하면 추가
    for (let i = blobs.length; i < newAnchors.length; i++) {
      const a = newAnchors[i];
      
      const sizeVariation = Math.random();
      let radius;
      if (sizeVariation < 0.1) {
        radius = 15 + Math.random() * 5;
      } else if (sizeVariation < 0.3) {
        radius = 6 + Math.random() * 3;
      } else {
        radius = 9 + Math.random() * 2.5;
      }
      
      blobs.push({
        anchorX: a.x, 
        anchorY: a.y,
        x: a.x + (Math.random()-0.5)*100,
        y: a.y + (Math.random()-0.5)*100,
        vx: 0, 
        vy: 0,
        radius: radius,
        phase: Math.random() * Math.PI * 2,
        radiusPhase: Math.random() * Math.PI * 2,
        flickerPhase: Math.random() * Math.PI * 2
      });
    }
  } else if (newAnchors.length < blobs.length) {
    blobs = blobs.slice(0, newAnchors.length);
  }
  
  // 기존 blob의 anchor 갱신
  for (let i = 0; i < newAnchors.length; i++) {
    blobs[i].anchorX = newAnchors[i].x;
    blobs[i].anchorY = newAnchors[i].y;
  }
  
  label.textContent = words[wordIdx];
});

// ===== 키보드 입력 =====
window.addEventListener('keydown', (e) => {
  // 특수 키 무시
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  
  if (e.key === 'Backspace') {
    e.preventDefault();
    if (customText.length > 0) {
      customText = customText.slice(0, -1);
      if (customText.length === 0) {
        // 텍스트가 비면 프리셋으로 복귀
        isTyping = false;
        setupBlobs(words[wordIdx]);
      } else {
        updateCustomText();
      }
    }
  } else if (e.key.length === 1) {
    // 일반 문자 입력
    e.preventDefault();
    isTyping = true;
    customText += e.key.toUpperCase();
    updateCustomText();
  }
});

function updateCustomText() {
  const newAnchors = extractAnchors(customText);
  
  // blob 개수 맞추기
  if (newAnchors.length > blobs.length) {
    for (let i = blobs.length; i < newAnchors.length; i++) {
      const a = newAnchors[i];
      
      const sizeVariation = Math.random();
      let radius;
      if (sizeVariation < 0.1) {
        radius = 15 + Math.random() * 5;
      } else if (sizeVariation < 0.3) {
        radius = 6 + Math.random() * 3;
      } else {
        radius = 9 + Math.random() * 2.5;
      }
      
      const anchorOffsetX = (Math.random() - 0.5) * 20;
      const anchorOffsetY = (Math.random() - 0.5) * 20;
      
      blobs.push({
        anchorX: a.x + anchorOffsetX, 
        anchorY: a.y + anchorOffsetY,
        x: a.x + (Math.random()-0.5)*100,
        y: a.y + (Math.random()-0.5)*100,
        vx: 0, 
        vy: 0,
        radius: radius,
        phase: Math.random() * Math.PI * 2,
        radiusPhase: Math.random() * Math.PI * 2,
        flickerPhase: Math.random() * Math.PI * 2,
        thresholdOffset: (Math.random() - 0.5) * 0.2
      });
    }
  } else if (newAnchors.length < blobs.length) {
    blobs = blobs.slice(0, newAnchors.length);
  }
  
  // 기존 blob의 anchor 갱신
  for (let i = 0; i < newAnchors.length; i++) {
    blobs[i].anchorX = newAnchors[i].x;
    blobs[i].anchorY = newAnchors[i].y;
  }
  
  label.textContent = customText;
}

// ===== Step 3: 매 프레임 업데이트 =====
let t = 0;

function update() {
  t += 0.025; // 0.012 → 0.025 (2배 빠르게)
  
  // 번지는 blob 업데이트
  for (let i = spreadingBlobs.length - 1; i >= 0; i--) {
    const sb = spreadingBlobs[i];
    
    // 생명력 감소
    sb.life -= 0.02;
    
    if (sb.life <= 0) {
      spreadingBlobs.splice(i, 1);
      continue;
    }
    
    // 감속
    sb.vx *= 0.95;
    sb.vy *= 0.95;
    
    // 위치 업데이트
    sb.x += sb.vx;
    sb.y += sb.vy;
    
    // 부유 효과
    sb.x += Math.cos(t + sb.phase) * 0.5;
    sb.y += Math.sin(t * 1.3 + sb.phase) * 0.5;
  }
  
  for (const b of blobs) {
    // 부패 효과: 생명력 감소
    if (b.isDying) {
      b.lifespan -= b.decaySpeed;
      
      // 죽으면 다시 살아남
      if (b.lifespan <= 0) {
        b.lifespan = 0.5 + Math.random() * 0.5;
        b.isDying = false;
      }
    } else {
      // 랜덤하게 죽기 시작 (0.05% 확률로 낮춤)
      if (Math.random() < 0.0005) {
        b.isDying = true;
      }
    }
    // (a) anchor 복원력
    const dx = b.anchorX - b.x;
    const dy = b.anchorY - b.y;
    const dist = Math.sqrt(dx*dx + dy*dy) + 0.01;
    
    b.vx += dx * 0.025;
    b.vy += dy * 0.025;
    
    // (b) 원형 회전 운동 (anchor 주변을 공전)
    const orbitAngle = Math.atan2(dy, dx) + Math.PI / 2; // 수직 방향
    const orbitForce = 0.03;
    b.vx += Math.cos(orbitAngle) * orbitForce;
    b.vy += Math.sin(orbitAngle) * orbitForce;
    
    // (c) 확산/수축 사이클 (호흡하는 느낌)
    const breathCycle = Math.sin(t * 0.5 + b.phase) * 0.5 + 0.5; // 0~1
    const expandForce = (breathCycle - 0.5) * 0.15;
    
    // 클러스터링: 큰 blob은 더 강하게 끌어당김
    const clusterStrength = b.radius > 12 ? 1.5 : 1.0;
    b.vx += (dx / dist) * expandForce * clusterStrength;
    b.vy += (dy / dist) * expandForce * clusterStrength;
    
    // (d) 부유 - 더 불규칙하게
    b.vx += Math.cos(t + b.phase) * 0.08;
    b.vy += Math.sin(t * 1.3 + b.phase) * 0.08;
    
    // 추가: 비정형 움직임 (각 blob마다 다른 주파수)
    b.vx += Math.sin(t * 0.7 + b.phase * 2) * 0.05;
    b.vy += Math.cos(t * 0.9 + b.phase * 3) * 0.05;
    
    // blob 간 반발력 (너무 가까우면 밀어냄) - 샘플링으로 최적화
    if (Math.random() < 0.3) { // 30% 확률로만 체크
      for (let j = 0; j < Math.min(5, blobs.length); j++) { // 최대 5개만 체크
        const idx = Math.floor(Math.random() * blobs.length);
        const other = blobs[idx];
        if (other === b) continue;
        
        const ddx = b.x - other.x;
        const ddy = b.y - other.y;
        const dd2 = ddx*ddx + ddy*ddy;
        const minDist = (b.radius + other.radius) * 0.8;
        
        if (dd2 < minDist * minDist && dd2 > 0.01) {
          const dd = Math.sqrt(dd2);
          const repelForce = (1 - dd / minDist) * 0.02;
          b.vx += (ddx / dd) * repelForce;
          b.vy += (ddy / dd) * repelForce;
        }
      }
    }
    
    // (e) 마우스 반발
    const mdx = b.x - mouse.x;
    const mdy = b.y - mouse.y;
    const md2 = mdx*mdx + mdy*mdy;
    
    if (md2 < 10000) { // 100px 반경
      const md = Math.sqrt(md2) + 0.01;
      const force = (1 - md / 100) * 2.5;
      b.vx += (mdx / md) * force;
      b.vy += (mdy / md) * force;
    }
    
    // (f) 감쇠 + 위치 갱신
    b.vx *= 0.82;
    b.vy *= 0.82;
    b.x += b.vx;
    b.y += b.vy;
  }
}

// ===== Step 4: 렌더링 =====
const GRID = 1; // 2 → 1 (매우 부드러운 윤곽선)
let cols, rows, field;

function setupField() {
  cols = Math.floor(W / GRID);
  rows = Math.floor(H / GRID);
  field = new Float32Array(cols * rows);
}

setupField();
window.addEventListener('resize', setupField);

function render() {
  field.fill(0);
  
  // 메인 blob + 번지는 blob 모두 렌더링
  const allBlobs = [...blobs, ...spreadingBlobs];
  
  // 각 blob 주변 그리드 셀에만 영향력 누적
  for (const b of allBlobs) {
    // 시간에 따라 반경 변화 (±20%)
    const radiusVariation = 1 + Math.sin(t * 2 + b.radiusPhase) * 0.2;
    let currentRadius = b.radius * radiusVariation;
    
    // 번지는 blob은 생명력에 따라 크기 조절
    const lifeFactor = b.life !== undefined ? b.life : 1.0;
    
    // 부패 효과: 죽어가는 blob은 크기 감소 (최소 30%까지만)
    const decayFactor = b.lifespan !== undefined ? Math.max(0.3, b.lifespan) : 1.0;
    
    const finalRadius = currentRadius * lifeFactor * decayFactor;
    
    // 랜덤 깜빡임 (5% 확률로 비활성화)
    const flicker = Math.sin(t * 5 + b.flickerPhase);
    if (flicker < -0.9) continue; // 일부 blob 건너뛰기
    
    // 임계값 왜곡 (각 blob마다 다른 영향력)
    const thresholdMod = 1 + (b.thresholdOffset || 0);
    const r2 = finalRadius * finalRadius * thresholdMod;
    const reach = finalRadius * 2.5;
    
    const minCx = Math.max(0, Math.floor((b.x - reach) / GRID));
    const maxCx = Math.min(cols - 1, Math.ceil((b.x + reach) / GRID));
    const minCy = Math.max(0, Math.floor((b.y - reach) / GRID));
    const maxCy = Math.min(rows - 1, Math.ceil((b.y + reach) / GRID));
    
    for (let cy = minCy; cy <= maxCy; cy++) {
      for (let cx = minCx; cx <= maxCx; cx++) {
        const px = cx * GRID;
        const py = cy * GRID;
        const ddx = px - b.x;
        const ddy = py - b.y;
        const d2 = ddx*ddx + ddy*ddy + 1;
        
        field[cy * cols + cx] += r2 / d2;
      }
    }
  }
  
  // 배경 검정
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  
  // 1) 먼저 내부를 완전히 채움 (임계값 > 0.7)
  for (let cy = 0; cy < rows; cy++) {
    for (let cx = 0; cx < cols; cx++) {
      const v = field[cy * cols + cx];
      
      // 내부용 약한 노이즈
      const noiseX = Math.sin(cx * 0.3 + t * 1.8) * 0.08;
      const noiseY = Math.cos(cy * 0.35 + t * 1.4) * 0.1;
      const noise = noiseX + noiseY;
      
      if (v + noise > 0.7) {
        // 내부는 완전 흰색으로 채움
        for (let dy = 0; dy < GRID; dy++) {
          for (let dx = 0; dx < GRID; dx++) {
            const px = cx * GRID + dx;
            const py = cy * GRID + dy;
            
            if (px < W && py < H) {
              ctx.fillStyle = 'rgba(255,255,255,1.0)';
              ctx.fillRect(px, py, 1, 1);
            }
          }
        }
      }
    }
  }
  
  // 2) 외곽선 레이어 (0.5 < 임계값 <= 0.7) - 회색으로 덮어씀
  for (let cy = 0; cy < rows; cy++) {
    for (let cx = 0; cx < cols; cx++) {
      const v = field[cy * cols + cx];
      
      // 외곽선용 강한 노이즈
      const outlineNoiseX = Math.sin(cx * 0.25 + t * 2.1) * 0.25;
      const outlineNoiseY = Math.cos(cy * 0.28 + t * 1.7) * 0.3;
      const chaoticNoise = Math.sin((cx * 0.4 + cy * 0.3) + t * 0.8) * 0.2;
      const breakNoise = Math.sin(cx * 1.3 + cy * 1.7 + t * 3) * 0.4;
      
      const vWithNoise = v + outlineNoiseX + outlineNoiseY + chaoticNoise + breakNoise;
      
      if (vWithNoise > 0.5 && vWithNoise <= 0.7) {
        // 외곽선은 회색
        const alpha = (vWithNoise - 0.5) / 0.2;
        
        for (let dy = 0; dy < GRID; dy++) {
          for (let dx = 0; dx < GRID; dx++) {
            const px = cx * GRID + dx;
            const py = cy * GRID + dy;
            
            if (px < W && py < H) {
              ctx.fillStyle = `rgba(160,160,160,${alpha * 0.9})`;
              ctx.fillRect(px, py, 1, 1);
            }
          }
        }
      }
    }
  }
  
  // 3) 바깥쪽 점묘 구름 (0.25~0.5 영역) - 외곽선 바깥
  for (const b of allBlobs) {
    const particleCount = 25;
    
    // 번지는 blob은 입자 수 감소
    const finalCount = b.life !== undefined ? Math.floor(particleCount * b.life) : particleCount;
    
    for (let i = 0; i < finalCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const distance = b.radius * (1.0 + Math.random() * 2.0);
      
      const px = b.x + Math.cos(angle) * distance;
      const py = b.y + Math.sin(angle) * distance;
      
      if (px >= 0 && px < W && py >= 0 && py < H) {
        let influence = 0;
        for (const bb of allBlobs) {
          const ddx = px - bb.x;
          const ddy = py - bb.y;
          const d2 = ddx*ddx + ddy*ddy + 1;
          influence += (bb.radius * bb.radius) / d2;
        }
        
        if (influence > 0.25 && influence < 0.5) {
          const alpha = (influence - 0.25) / 0.25;
          const lifeFactor = b.life !== undefined ? b.life : 1.0;
          const size = Math.random() < 0.85 ? 1 : 2;
          ctx.fillStyle = `rgba(255,255,255,${alpha * 0.5 * lifeFactor})`;
          ctx.fillRect(Math.floor(px), Math.floor(py), size, size);
        }
      }
    }
  }
  
  // 4) 주변 떠다니는 입자
  for (let i = 0; i < 30; i++) {
    const px = (Math.sin(t * 0.4 + i * 1.7) * 0.5 + 0.5) * W;
    const py = (Math.cos(t * 0.25 + i * 2.3) * 0.5 + 0.5) * H;
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(Math.floor(px), Math.floor(py), 1, 1);
  }
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

loop();
})();
</script>
</body>
</html>
