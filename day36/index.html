<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>다시 찍어 주세요 — typo-vibe</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.39.3/dist/galmuri.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a class="home" href="../index.html">← 홈</a>
  <span class="title">다시 찍어 주세요</span>
  <ol class="route" id="route" aria-label="출근길"></ol>
  <span class="hud">
    <span class="clock" id="clock" aria-label="현재 시각"></span>
    <span id="balance"></span>
    <span class="awkward" id="awkward"></span>
  </span>
  <button type="button" class="sound" id="sound" aria-pressed="true">♪ 소리</button>
</header>

<main class="wrap">
  <section class="stage" id="stage" aria-label="개찰구">
    <div class="world" id="world"></div>
    <button type="button" class="reader" data-reader="left"></button>
    <button type="button" class="reader" data-reader="right"></button>

    <div class="board">
      <canvas class="led" id="led" role="img" aria-live="polite"></canvas>
      <p class="fare" id="fare"></p>
    </div>
    <div class="reactions" id="reactions" aria-live="polite"></div>
    <div class="fade" id="fade"></div>
    <div class="flash" id="flash"></div>
    <img class="polaroid" id="polaroid" alt="" aria-hidden="true">
    <div class="queue" id="queue"><span id="queue-count"></span></div>

    <div class="card" id="card" aria-hidden="true">
      <span class="card-face"></span><span class="card-face second"></span>
    </div>
  </section>

  <div class="controls">
    <p class="holding" id="holding"></p>
    <div class="actions">
      <button type="button" class="btn" id="take-out"></button>
      <button type="button" class="btn" id="charge"></button>
      <button type="button" class="btn" id="turn-left" aria-label="카메라 왼쪽으로 돌리기">◀</button>
      <button type="button" class="btn" id="reset-view">↺ 시점 원래대로</button>
      <button type="button" class="btn" id="turn-right" aria-label="카메라 오른쪽으로 돌리기">▶</button>
      <button type="button" class="btn" id="webcam" aria-pressed="false"></button>
    </div>
    <p class="hint" id="webcam-note" aria-live="polite"></p>
    <p class="hint" id="hint"></p>
  </div>
</main>

<dialog class="modal" id="modal" aria-labelledby="modal-title">
  <div class="sign" id="modal-sign"><span class="sign-line" id="modal-line"></span><span id="modal-title"></span></div>
  <div class="modal-body">
    <p class="modal-text" id="modal-text"></p>
    <ul class="modal-list" id="modal-list"></ul>
    <div class="modal-photos" id="modal-photos"></div>
    <button type="button" class="btn primary" id="modal-btn"></button>
  </div>
</dialog>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script src="story.js"></script>
<script src="sound.js"></script>
<script src="led.js"></script>
<script src="game.js"></script>
<script type="module" src="world.js"></script>
<script type="module" src="facetrack.js"></script>
</body>
</html>
